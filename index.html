<script>
  // Claude 아티팩트의 window.storage API를 브라우저 localStorage로 그대로 흉내낸다.
  // 앱 코드는 손대지 않고, 저장소 백엔드만 이 기기의 localStorage로 바꿔치기하는 것.
  // 즉 이 브라우저/이 기기에서만 데이터가 남고, 다른 기기와는 동기화되지 않는다.
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };

  // 로딩 중 실제로 어떤 에러가 났는지 화면에 그대로 보여준다 (콘솔 안 봐도 되게).
  function showBootError(msg) {
    const el = document.getElementById('boot-fallback');
    if (!el) return;
    el.style.cssText = 'position:fixed;inset:0;background:#0A0E1A;color:#F87171;font:12px/1.6 -apple-system,system-ui,monospace;padding:24px;white-space:pre-wrap;overflow:auto;letter-spacing:normal;text-align:left;z-index:9999;';
    el.textContent = '앱을 불러오는 중 오류가 발생했어요:\n\n' + msg;
  }
  window.addEventListener('error', (e) => showBootError((e.error && e.error.stack) || e.message || String(e)));
  window.addEventListener('unhandledrejection', (e) => showBootError((e.reason && e.reason.stack) || String(e.reason)));
</script>

function plMulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function plBuildSampleEntries() {
  const rand = plMulberry32(20260628);
  const start = new Date(2026, 5, 28);
  const days = 30;
  const targetProfit = 78316520;
  let cumulative = 0;
  const entries = [];
  for (let i = 0; i < days; i++) {
    const dt = new Date(start);
    dt.setDate(start.getDate() + i);
    const progress = i / (days - 1);
    const drift = targetProfit * progress;
    const noiseScale = 2600000 * (1 - progress * 0.4);
    const noise = (rand() - 0.5) * noiseScale;
    const newCumulative = i === days - 1 ? targetProfit : Math.max(0, drift + noise);
    entries.push({ date: dt.toISOString().slice(0, 10), delta: Math.round(newCumulative - cumulative) });
    cumulative = newCumulative;
  }
  return entries;
}

function plMonthlyTotalsForYear(sorted, year) {

function plPrimaryCategoryOf(entry) {
  const amounts = plCategoryAmountsOf(entry);
  const keys = Object.keys(amounts);
  return keys.length === 1 ? keys[0] : null;
}

// 종목명 뒤에 붙은 "(1차매도)", "3주" 같은 수량/차수 표기를 지워서, 같은 종목이면
// 표기가 달라도 랭킹 집계에서 하나로 합쳐지게 한다. 원본 기록의 이름 자체는 안 건드린다.
function normalizeStockName(name) {
  return name
    .replace(/\([^)]*\)/g, '')
    .replace(/\s*\d+주\s*$/g, '')
    .replace(/\s+/g, '')
    .trim();
}

function plComputeDerived({ entries, settings, viewMonth, summaryMonth, yearlyTargets, longterm, historyExpanded }) {
  const sorted = entries.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const cumulativeByDate = {};
  let running = 0;
  sorted.forEach((e) => { running += e.delta; cumulativeByDate[e.date] = running; });

  const currentProfit = sorted.length ? cumulativeByDate[sorted[sorted.length - 1].date] : 0;
  const remaining = settings.target - currentProfit;
  const progressPct = settings.target > 0 ? (currentProfit / settings.target) * 100 : 0;

  let streak = 0;
  if (sorted.length) {
    const dateSet = {};
    sorted.forEach((e) => { dateSet[e.date] = true; });
    const cursor = new Date(sorted[sorted.length - 1].date + 'T00:00:00');
    while (dateSet[cursor.toISOString().slice(0, 10)]) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
  }

  const summaryY = summaryMonth.getFullYear();
  const summaryM = summaryMonth.getMonth();
  const thisMonth = summaryY + '-' + String(summaryM + 1).padStart(2, '0');
  const monthEntries = sorted.filter((e) => e.date.slice(0, 7) === thisMonth);
  const monthTotal = monthEntries.reduce((s, e) => s + e.delta, 0);
  const monthAvg = monthEntries.length ? monthTotal / monthEntries.length : 0;
  let monthBest = null;
  monthEntries.forEach((e) => { if (monthBest === null || e.delta > monthBest) monthBest = e.delta; });
  const prevMonthDate = new Date(summaryY, summaryM - 1, 1);
  const prevMonthKey = prevMonthDate.getFullYear() + '-' + String(prevMonthDate.getMonth() + 1).padStart(2, '0');
  const prevMonthEntries = sorted.filter((e) => e.date.slice(0, 7) === prevMonthKey);
  const prevMonthTotal = prevMonthEntries.reduce((s, e) => s + e.delta, 0);
  const prevMonthAvg = prevMonthEntries.length ? prevMonthTotal / prevMonthEntries.length : 0;
  let momPct = null;
  if (prevMonthAvg !== 0 && monthEntries.length) momPct = ((monthAvg - prevMonthAvg) / Math.abs(prevMonthAvg)) * 100;

  const chartData = sorted.map((e) => {
    const dt = new Date(e.date + 'T00:00:00');
    return { date: e.date, time: dt.getTime(), label: (dt.getMonth() + 1) + '/' + dt.getDate(), profit: cumulativeByDate[e.date] };
  });
  const latestProfitLabel = sorted.length ? plFormatWon(currentProfit) : '';
  const targetProfitLine = settings.target > 0 ? settings.target : null;

  let chartMax = 0;
  chartData.forEach((dd) => { if (dd.profit > chartMax) chartMax = dd.profit; });
  const chartCeiling = Math.max(chartMax, targetProfitLine || 0);
  let yAxisTicks = [0];
  if (chartCeiling > 0) {
    const roughStep = chartCeiling / 4;
    const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
    const residual = roughStep / magnitude;
    const niceResidual = residual > 5 ? 10 : residual > 2 ? 5 : residual > 1 ? 2 : 1;
    const step = niceResidual * magnitude;
    yAxisTicks = [];
    for (let v = 0; v <= chartCeiling + step; v += step) yAxisTicks.push(Math.round(v));
  }
  const yAxisMax = yAxisTicks[yAxisTicks.length - 1] || 1;

  const vy = viewMonth.getFullYear(), vm = viewMonth.getMonth();
  const firstDow = new Date(vy, vm, 1).getDay();
  const daysInMonth = new Date(vy, vm + 1, 0).getDate();
  const deltaMap = {};
  sorted.forEach((e) => { deltaMap[e.date] = e.delta; });
  const calendarCells = [];
  for (let i = 0; i < firstDow; i++) calendarCells.push(null);
  for (let dnum = 1; dnum <= daysInMonth; dnum++) {
    const dateStr = vy + '-' + String(vm + 1).padStart(2, '0') + '-' + String(dnum).padStart(2, '0');
    calendarCells.push({ day: dnum, dateStr, delta: Object.prototype.hasOwnProperty.call(deltaMap, dateStr) ? deltaMap[dateStr] : null });
  }

  const recentEntries = sorted.slice().reverse();
  const visibleHistory = historyExpanded ? recentEntries : recentEntries.slice(0, 4);

  const yearlyTotals = {};
  sorted.forEach((e) => {
    const y = e.date.slice(0, 4);
    yearlyTotals[y] = (yearlyTotals[y] || 0) + e.delta;
  });
  const currentYearNum = Number(plTodayStr().slice(0, 4));
  if (!Object.prototype.hasOwnProperty.call(yearlyTotals, String(currentYearNum))) yearlyTotals[String(currentYearNum)] = 0;
  const yearList = Object.keys(yearlyTotals).sort((a, b) => Number(b) - Number(a));

  // 최근 6개월 기록으로 월평균 수익 속도를 구해, 목표 달성 예상 시점을 계산한다.
  let recentMonthlyRate = 0;
  if (sorted.length) {
    const lastDate = new Date(sorted[sorted.length - 1].date + 'T00:00:00');
    const cutoff = new Date(lastDate);
    cutoff.setMonth(cutoff.getMonth() - 6);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    const recent = sorted.filter((e) => e.date >= cutoffStr);
    const recentSum = recent.reduce((acc, e) => acc + e.delta, 0);
    const firstRecent = recent.length ? new Date(recent[0].date + 'T00:00:00') : lastDate;
    const spanMonths = Math.max(1, (lastDate - firstRecent) / (1000 * 60 * 60 * 24 * 30.44));
    recentMonthlyRate = recentSum / spanMonths;
  }
  function etaLabel(remainingAmt) {
    if (remainingAmt <= 0) return '달성 완료';
    if (recentMonthlyRate <= 0) return null;
    const months = Math.ceil(remainingAmt / recentMonthlyRate);
    if (months > 12 * 40) return null;
    const eta = new Date();
    eta.setMonth(eta.getMonth() + months);
    return `${String(eta.getFullYear()).slice(2)}.${eta.getMonth() + 1} 달성예상`;
  }

  const longtermCards = ['3', '5', '10'].map((durKey) => {
    const dur = Number(durKey);
    const arr = longterm[durKey] || [];
    const goal = arr.length ? arr[arr.length - 1] : { baseYear: currentYearNum, target: PL_DEFAULT_LONGTERM_TARGETS[durKey] };
    const endYear = goal.baseYear + dur - 1;
    let sum = 0;
    for (let y2 = goal.baseYear; y2 <= endYear; y2++) sum += yearlyTotals[String(y2)] || 0;
    const pct = goal.target > 0 ? (sum / goal.target) * 100 : 0;
    const completed = currentYearNum > endYear;
    const remainingAmt = Math.max(0, goal.target - sum);
    return { duration: dur, baseYear: goal.baseYear, endYear, target: goal.target, sum, pct, completed, remaining: remainingAmt, eta: completed ? null : etaLabel(remainingAmt) };
  });

  return {
    sorted, currentProfit, remaining, progressPct, chartData, latestProfitLabel,
    yAxisTicks, yAxisMax, calendarCells, recentEntries, visibleHistory, streak,
    monthTotal, monthAvg, monthCount: monthEntries.length, monthBest, momPct,
    summaryY, summaryM, targetProfitLine, yearlyTotals, yearList, currentYearNum,
    recentMonthlyRate, mainGoalEta: etaLabel(remaining),
    longtermCards,
  };
}

function PlMoneyField({ value, onChange, placeholder, prefix, dark }) {
  const display = (value === null || value === undefined) ? '' : plFormatComma(value);
  return (
    <div className={'amount-input-wrap' + (dark ? ' dark' : '')}>
      {prefix && <span className="amount-prefix">{prefix}</span>}
      <input
        type="text"
        inputMode="numeric"
        pattern="[0-9]*"
        value={display}
        placeholder={placeholder || '0'}
        onChange={(e) => {
          const digits = e.target.value.replace(/[^0-9]/g, '');
          onChange(digits === '' ? null : Number(digits));
        }}
      />
      <span className="amount-suffix">원</span>
    </div>
  );
}

function PlChartSVG({ chartData, yAxisTicks, yAxisMax, targetProfitLine }) {
  const W = 400, H = 190;
  const leftPad = 50, rightPad = 10, topPad = 14, bottomPad = 24;
  const plotW = W - leftPad - rightPad;
  const plotH = H - topPad - bottomPad;
  const n = chartData.length;
  const minTime = n > 0 ? chartData[0].time : 0;
  const maxTime = n > 0 ? chartData[n - 1].time : 0;
  const timeSpan = maxTime - minTime;
  const xAt = (i) => {
    if (n <= 1) return leftPad + plotW / 2;
    if (timeSpan <= 0) return leftPad + (plotW * i) / (n - 1);
    return leftPad + (plotW * (chartData[i].time - minTime)) / timeSpan;
  };
  const yAt = (v) => topPad + plotH - (Math.max(0, v) / yAxisMax) * plotH;

  let pathD = '', areaD = '', lastX = 0, lastY = 0;
  const labelIdx = [];
  if (n > 0) {
    chartData.forEach((dd, i) => {
      const x = xAt(i), y = yAt(dd.profit);
      pathD += (i === 0 ? 'M' : ' L') + x.toFixed(1) + ',' + y.toFixed(1);
    });
    areaD = pathD + ' L' + xAt(n - 1).toFixed(1) + ',' + (topPad + plotH).toFixed(1) +
      ' L' + xAt(0).toFixed(1) + ',' + (topPad + plotH).toFixed(1) + ' Z';
    lastX = xAt(n - 1); lastY = yAt(chartData[n - 1].profit);
    const minLabelGap = 38;
    let lastLabelX = -Infinity;
    for (let li = 0; li < n; li++) {
      const lx = xAt(li);
      if (lx - lastLabelX >= minLabelGap) { labelIdx.push(li); lastLabelX = lx; }
    }
    if (labelIdx[labelIdx.length - 1] !== n - 1) {
      if (labelIdx.length && lastX - xAt(labelIdx[labelIdx.length - 1]) < minLabelGap) {
        labelIdx[labelIdx.length - 1] = n - 1;
      } else labelIdx.push(n - 1);
    }
  }

  return (
    <svg className="chart-svg" viewBox={`0 0 ${W} ${H}`} width="100%" height="190" preserveAspectRatio="none">
      <defs>
        <linearGradient id="plFillProfit" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.mint} stopOpacity="0.30" />
          <stop offset="45%" stopColor={C.mint} stopOpacity="0.10" />
          <stop offset="100%" stopColor={C.mint} stopOpacity="0" />
        </linearGradient>
        <filter id="plLineGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur" />
        </filter>
      </defs>
      {yAxisTicks.map((t, idx) => {
        const gy = yAt(t);
        return (
          <g key={idx}>
            <line x1={leftPad} y1={gy} x2={W - rightPad} y2={gy} stroke={C.gridLine} strokeWidth="1" />
            <text x={leftPad - 8} y={gy + 3} textAnchor="end" fontSize="11" fontFamily={BODY_FONT} fill={C.soft}>{plFormatAxisWon(t)}</text>
          </g>
        );
      })}
      {n > 0 && <path d={areaD} fill="url(#plFillProfit)" stroke="none" />}
      {targetProfitLine !== null && targetProfitLine > 0 && targetProfitLine <= yAxisMax && (
        <g>
          <line x1={leftPad} y1={yAt(targetProfitLine)} x2={W - rightPad} y2={yAt(targetProfitLine)} stroke={C.amber} strokeWidth="1.5" strokeDasharray="4 4" />
          <text x={W - rightPad - 2} y={yAt(targetProfitLine) - 4} textAnchor="end" fontSize="10" fontFamily={BODY_FONT} fill={C.amber} fontWeight="700">목표</text>
        </g>
      )}
      {n > 0 && (
        <>
          <path d={pathD} fill="none" stroke={C.mint} strokeWidth="5" strokeLinejoin="round" strokeLinecap="round" opacity="0.22" filter="url(#plLineGlow)" />
          <path d={pathD} fill="none" stroke={C.mint} strokeWidth="2.6" strokeLinejoin="round" strokeLinecap="round" />
          <circle cx={lastX.toFixed(1)} cy={lastY.toFixed(1)} r="7" fill={C.mint} opacity="0.22" />
          <circle cx={lastX.toFixed(1)} cy={lastY.toFixed(1)} r="3.5" fill={C.card} stroke={C.mint} strokeWidth="2" />
          {labelIdx.map((i) => {
            const dd = chartData[i];
            const x = xAt(i);
            const anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
            return <text key={i} x={x.toFixed(1)} y={H - 6} textAnchor={anchor} fontSize="11" fontFamily={BODY_FONT} fill={C.soft}>{dd.label}</text>;
          })}
        </>
      )}
    </svg>
  );
}

function PnlApp({ tossUrl, theme, setTheme }) {
  const [ready, setReady] = useState(false);
  const [entries, setEntries] = useState([]);
  const [settings, setSettings] = useState(PL_DEFAULT_SETTINGS);
  const [yearlyTargets, setYearlyTargets] = useState({});
  const [longterm, setLongterm] = useState({});

  const [viewMonth, setViewMonth] = useState(new Date());
  const [summaryMonth, setSummaryMonth] = useState(new Date());
  const [mainYear, setMainYear] = useState(null);
  const [analysisTab, setAnalysisTab] = useState('chart');
  const [historyExpanded, setHistoryExpanded] = useState(false);
  const [monthDetailOpen, setMonthDetailOpen] = useState(false);
  const [plannedLoss, setPlannedLoss] = useState(null); // 양도세 계산기: 추가로 손절할 예정 금액
  const [confirmDeleteDate, setConfirmDeleteDate] = useState(null);

  const [quickDate, setQuickDate] = useState(plTodayStr());
  const [quickAmount, setQuickAmount] = useState(null);
  const [quickCategory, setQuickCategory] = useState(null);
  const [quickError, setQuickError] = useState('');

  const [panelOpen, setPanelOpen] = useState(false);
  const [editingDate, setEditingDate] = useState(null);  const [formDate, setFormDate] = useState(plTodayStr());
  const [formItems, setFormItems] = useState([{ name: '', amount: null, category: null }]);
  const [formError, setFormError] = useState('');

  const [settingsPanelOpen, setSettingsPanelOpen] = useState(false);
  const [importMessage, setImportMessage] = useState('');
  const fileInputRef = useRef(null);

  const [fullView, setFullView] = useState(null);
  const [bulkSelected, setBulkSelected] = useState({}); // { date: categoryKey } — 일괄 태그 임시 선택
  const [selectedYear, setSelectedYear] = useState(null);

  // 실현손익(원장) + 미실현손익(토스 API) → 현재 누적 수익
  const [plPrivacy, setPlPrivacy] = useState(false);
  const [tossData, setTossData] = useState(null);
  const [tossLoading, setTossLoading] = useState(false);
  const [tossError, setTossError] = useState('');
  const [unrealizedDetailOpen, setUnrealizedDetailOpen] = useState(false);
  const refreshToss = useCallback(async () => {
    setTossLoading(true);
    setTossError('');
    try {
      const data = await fetchTossSummary(tossUrl);
      setTossData(data);
    } catch (err) {
      setTossError('토스 데이터를 불러오지 못했어요');
    } finally {
      setTossLoading(false);
    }
  }, [tossUrl]);
  useEffect(() => { refreshToss(); }, [refreshToss]);


  useEffect(() => {
    (async () => {
      let e = null, s = null, yt = null, lt = null;
      try { const r = await window.storage.get(PL_ENTRIES_KEY, false); e = r ? JSON.parse(r.value) : null; } catch {}
      try { const r = await window.storage.get(PL_SETTINGS_KEY, false); s = r ? JSON.parse(r.value) : null; } catch {}
      try { const r = await window.storage.get(PL_YEARLY_TARGETS_KEY, false); yt = r ? JSON.parse(r.value) : null; } catch {}
      try { const r = await window.storage.get(PL_LONGTERM_KEY, false); lt = r ? JSON.parse(r.value) : null; } catch {}

      const finalEntries = (e && e.length) ? e : plBuildSampleEntries();
      const finalSettings = s || PL_DEFAULT_SETTINGS;
      const finalYearlyTargets = yt || {};
      const curYear = Number(plTodayStr().slice(0, 4));
      const finalLongterm = lt || {};
      ['3', '5', '10'].forEach((dur) => {
        if (!finalLongterm[dur] || !finalLongterm[dur].length) {
          finalLongterm[dur] = [{ baseYear: curYear, target: PL_DEFAULT_LONGTERM_TARGETS[dur], createdAt: Date.now() }];
        }
      });

      setEntries(finalEntries);
      setSettings(finalSettings);
      setYearlyTargets(finalYearlyTargets);
      setLongterm(finalLongterm);
      setReady(true);

      if (!e) { try { await window.storage.set(PL_ENTRIES_KEY, JSON.stringify(finalEntries), false); } catch {} }
      if (!s) { try { await window.storage.set(PL_SETTINGS_KEY, JSON.stringify(finalSettings), false); } catch {} }
      if (!yt) { try { await window.storage.set(PL_YEARLY_TARGETS_KEY, JSON.stringify(finalYearlyTargets), false); } catch {} }
      if (!lt) { try { await window.storage.set(PL_LONGTERM_KEY, JSON.stringify(finalLongterm), false); } catch {} }

      // 직전에 사용한 카테고리를 기본 선택으로 되살린다 (매번 고르는 수고를 줄임).
      try {
        const lc = await window.storage.get(PL_LASTCAT_KEY, false);
        const v = lc ? JSON.parse(lc.value) : null;
        if (v && PL_PROFIT_CATEGORIES.some((c) => c.key === v)) setQuickCategory(v);
      } catch {}
    })();
  }, []);

  const persistEntries = useCallback(async (next) => {
    setEntries(next);
    try { await window.storage.set(PL_ENTRIES_KEY, JSON.stringify(next), false); } catch {}
  }, []);
  const persistSettings = useCallback(async (next) => {
    setSettings(next);
    try { await window.storage.set(PL_SETTINGS_KEY, JSON.stringify(next), false); } catch {}
  }, []);
  const persistYearlyTargets = useCallback(async (next) => {
    setYearlyTargets(next);
    try { await window.storage.set(PL_YEARLY_TARGETS_KEY, JSON.stringify(next), false); } catch {}
  }, []);
  const persistLongterm = useCallback(async (next) => {
    setLongterm(next);
    try { await window.storage.set(PL_LONGTERM_KEY, JSON.stringify(next), false); } catch {}
  }, []);

  const d = useMemo(
    () => plComputeDerived({ entries, settings, viewMonth, summaryMonth, yearlyTargets, longterm, historyExpanded }),
    [entries, settings, viewMonth, summaryMonth, yearlyTargets, longterm, historyExpanded]
  );

  // 이번 달 요약의 수익금 클릭 시 보여줄 종목별 분류 (그 달 일별 기록의 items를 종목명 기준으로 합산).
  const monthStockSections = useMemo(() => {
    const monthKey = d.summaryY + '-' + String(d.summaryM + 1).padStart(2, '0');
    const groups = {};
    PL_PROFIT_CATEGORIES.forEach((c) => { groups[c.key] = {}; });
    groups.uncategorized = {};
    entries.filter((e) => e.date.slice(0, 7) === monthKey).forEach((e) => {
      if (e.items && e.items.length) {
        e.items.forEach((it) => {
          const raw = (it.name || '').trim();
          const name = raw ? normalizeStockName(raw) : '이름 없음';
          const catKey = (it.category && groups[it.category]) ? it.category : 'uncategorized';
          groups[catKey][name] = (groups[catKey][name] || 0) + (it.amount || 0);
        });
      } else {
        const catKey = (e.category && groups[e.category]) ? e.category : 'uncategorized';
        groups[catKey]['전체'] = (groups[catKey]['전체'] || 0) + e.delta;
      }
    });
    return [...PL_PROFIT_CATEGORIES, { key: 'uncategorized', label: '미분류', color: C.faint }]
      .map((c) => {
        const items = Object.entries(groups[c.key]).sort((a, b) => b[1] - a[1]).map(([name, value]) => ({ name, value }));
        const total = items.reduce((s, it) => s + it.value, 0);
        return { key: c.key, label: c.label, color: c.color, items, total };
      })
      .filter((s) => s.items.length > 0);
  }, [entries, d.summaryY, d.summaryM]);
  const monthHasData = monthStockSections.length > 0;

  // 일별 기록에 붙인 카테고리 태그를 실제로 집계한 실현손익 분포 (전체 기간 합산).
  // 분기별 수동입력(annualPnl)과는 별개의, 실제 기록 기반 값이다.
  // 수익 탭은 "올해" 실현손익만 보여준다 (역대 누적은 자산 탭에서 확인).
  // 태그가 전혀 없는 기록들 (일괄 태그 대상). items가 있는 기록은 종목별로 따로
  // 지정해야 해서 여기서는 제외하고, 단일 금액 기록만 대상으로 한다.
  const untaggedEntries = useMemo(
    () => entries
      .filter((e) => !e.category && !(e.items && e.items.length))
      .sort((a, b) => (a.date < b.date ? 1 : -1)),
    [entries]
  );

  function applyBulkTags() {
    const next = entries.map((e) => {
      const picked = bulkSelected[e.date];
      if (picked && !e.category && !(e.items && e.items.length)) return { ...e, category: picked };
      return e;
    });
    persistEntries(next);
    setBulkSelected({});
  }

  const categoryBreakdown = useMemo(() => {
    const totals = {};
    PL_PROFIT_CATEGORIES.forEach((c) => { totals[c.key] = 0; });
    let uncategorized = 0;
    const yr = plTodayStr().slice(0, 4);
    entries.filter((e) => e.date.slice(0, 4) === yr).forEach((e) => {
      if (e.items && e.items.length) {
        e.items.forEach((it) => {
          if (it.category && totals[it.category] !== undefined) totals[it.category] += it.amount || 0;
          else uncategorized += it.amount || 0;
        });
      } else if (e.category && totals[e.category] !== undefined) {
        totals[e.category] += e.delta;
      } else {
        uncategorized += e.delta;
      }
    });
    return { year: yr, byCategory: PL_PROFIT_CATEGORIES.map((c) => ({ ...c, total: totals[c.key] })), uncategorized };
  }, [entries]);

  function openPanelForDate(dateStr) {
    setFormDate(dateStr);
    setFormError('');
    const existing = entries.find((e) => e.date === dateStr) || null;
    if (existing) {
      setEditingDate(dateStr);
      if (existing.items && existing.items.length) {
        setFormItems(existing.items.map((it) => ({ name: it.name || '', amount: it.amount, category: it.category || null })));
      } else {
        setFormItems([{ name: '', amount: existing.delta, category: existing.category || null }]);
      }
    } else {

  function submitEntry() {
    setFormError('');
    const validItems = formItems.filter((it) => it.amount != null && it.amount !== 0);
    if (!formDate || !validItems.length) { setFormError('날짜와 금액을 입력해주세요.'); return; }
    const total = validItems.reduce((s, it) => s + it.amount, 0);
    const hasNames = validItems.some((it) => it.name && it.name.trim() !== '');
    const hasCategories = validItems.some((it) => it.category);
    let entry = { date: formDate, delta: total };
    if (hasNames || hasCategories) {
      entry.items = validItems.map((it) => ({ name: (it.name || '').trim(), amount: it.amount, ...(it.category ? { category: it.category } : {}) }));
    } else if (validItems.length === 1 && validItems[0].category) {
      entry.category = validItems[0].category;
    }
    // "수정"(editingDate 있음)이 아니라 "새로 추가"인데 그 날짜에 이미 기록이 있으면,
    // 덮어쓰지 않고 기존 기록에 이번 입력을 더한다.
    if (!editingDate) {
      const existing = entries.find((e) => e.date === formDate);
      if (existing) {
        const existingItems = (existing.items && existing.items.length)
          ? existing.items
          : [{ name: '', amount: existing.delta, ...(existing.category ? { category: existing.category } : {}) }];
        const newItems = entry.items || [{ name: '', amount: entry.delta, ...(entry.category ? { category: entry.category } : {}) }];
        entry = { date: formDate, delta: existing.delta + total, items: [...existingItems, ...newItems] };
      }
    }
    const next = entries.filter((e) => e.date !== formDate).concat([entry]);
    persistEntries(next);
    closePanel();

    const existing = entries.find((e) => e.date === quickDate);
    const newItem = { name: '', amount: quickAmount, ...(quickCategory ? { category: quickCategory } : {}) };
    let entry;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const importedEntries = Array.isArray(parsed.entries) ? parsed.entries : null;
        const importedSettings = parsed.settings && typeof parsed.settings.target === 'number' ? parsed.settings : null;
        if (!importedEntries) { setImportMessage('올바른 백업 파일이 아니에요.'); return; }
        const validEntries = importedEntries.filter((en) => en && typeof en.date === 'string' && typeof en.delta === 'number');
        persistEntries(validEntries);
        if (importedSettings) persistSettings(importedSettings);
        setImportMessage(validEntries.length + '건 불러왔어요.');
      } catch { setImportMessage('파일을 읽는 데 실패했어요.'); }
    };
    reader.readAsText(file);

                    ))}
                  </div>
                  <button onClick={() => setFormItems((arr) => [...arr, { name: '', amount: null, category: null }])} className="text-xs" style={{ color: C.brand, fontWeight: 600 }}>+ 종목 추가</button>
                  <button onClick={submitEntry} className="w-full py-3.5 rounded-xl text-sm" style={{ backgroundColor: C.brand, color: C.brandDark, fontWeight: 700 }}>{editingDate ? '저장' : '기록'}</button>
                  {formError && <div className="text-xs text-center" style={{ color: C.red }}>{formError}</div>}
                </div>
              </div>
            </div>
          );
        })()}

        {/* 설정 바텀시트 */}
        {settingsPanelOpen && (
          <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ backgroundColor: C.overlay }} onClick={() => setSettingsPanelOpen(false)}>
            <div className="w-full max-w-md rounded-t-2xl overflow-y-auto" style={{ backgroundColor: C.bgAlt, borderTop: `1px solid ${C.border}`, maxHeight: '92vh' }} onClick={(e) => e.stopPropagation()}>
              <div className="sticky top-0 flex items-center justify-between px-5 pt-5 pb-4" style={{ backgroundColor: C.bgAlt, borderBottom: `1px solid ${C.border}` }}>
                <div className="text-lg" style={{ fontWeight: 700 }}>손익 설정</div>
                <button onClick={() => setSettingsPanelOpen(false)} className="rounded-lg flex items-center justify-center" style={{ width: 34, height: 34, backgroundColor: C.cardAlt }}><X size={16} /></button>
              </div>
              <div className="p-5 space-y-7">
                <div>
                  <div className="text-sm mb-1" style={{ fontWeight: 700 }}>전체 목표금액</div>
                  <div className="text-xs mb-3" style={{ color: C.muted }}>누적 수익 카드 상단의 진행률 기준 목표예요.</div>
                  <div className="flex items-center px-3 rounded-lg" style={{ backgroundColor: C.cardAlt, border: `1px solid ${C.border}`, height: 44 }}>
                    <span className="text-sm mr-1" style={{ color: C.brand }}>+</span>
                    <input
                      type="text" inputMode="numeric" value={settings.target != null ? plFormatComma(settings.target) : ''}
                      onChange={(e) => { const dgt = e.target.value.replace(/[^0-9]/g, ''); persistSettings({ ...settings, target: dgt === '' ? 0 : Number(dgt) }); }}
                      className="flex-1 min-w-0 bg-transparent outline-none text-sm" style={{ fontWeight: 700, ...TAB }}
                    />
                    <span className="text-xs" style={{ color: C.faint }}>원</span>
                  </div>
                </div>
                <div>
                  <div className="text-sm mb-1" style={{ fontWeight: 700 }}>손익 기록만 백업</div>
                  <div className="text-xs mb-3" style={{ color: C.muted }}>
                    자산까지 한 번에 백업하려면 <b style={{ color: C.soft }}>더보기 &gt; JSON 백업</b>을 쓰는 게 좋아요. 여기서는 손익 기록만 따로 내보낼 수 있어요.
                  </div>
                  <div className="flex gap-2">
                    <button onClick={exportData} className="flex-1 text-xs px-3 py-2.5 rounded-lg" style={{ backgroundColor: C.cardAlt, color: C.soft, fontWeight: 600 }}>내보내기</button>
                    <button onClick={triggerImport} className="flex-1 text-xs px-3 py-2.5 rounded-lg" style={{ backgroundColor: C.cardAlt, color: C.soft, fontWeight: 600 }}>가져오기</button>
                  </div>
                  {importMessage && <div className="text-xs mt-2" style={{ color: C.muted }}>{importMessage}</div>}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* 미실현손익 상세 바텀시트: 달러 기준 손익 / 수익률 / 현재환율 */}
        {unrealizedDetailOpen && tossData && (
          <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ backgroundColor: C.overlay }} onClick={() => setUnrealizedDetailOpen(false)}>
            <div className="w-full max-w-md rounded-t-2xl overflow-y-auto" style={{ backgroundColor: C.bgAlt, borderTop: `1px solid ${C.border}`, maxHeight: '80vh' }} onClick={(e) => e.stopPropagation()}>
              <div className="sticky top-0 flex items-center justify-between px-5 pt-5 pb-4" style={{ backgroundColor: C.bgAlt, borderBottom: `1px solid ${C.border}` }}>
                <div className="text-lg" style={{ fontWeight: 700 }}>미실현손익 상세</div>
                <button onClick={() => setUnrealizedDetailOpen(false)} className="rounded-lg flex items-center justify-center" style={{ width: 34, height: 34, backgroundColor: C.cardAlt }}><X size={16} /></button>
              </div>
              <div className="p-5 space-y-2.5">
                {(() => {
                  const krwRate = tossData.unrealizedProfitLossRate * 100;
                  // 달러 기준 수익률: API가 직접 안 줘서 역산한다.
                  // 현재 평가액(원화)은 항상 "지금 환율"로 정확히 환산된 값이라, 여기서
                  // 거꾸로 현재 평가액(달러)을 구하고 달러 손익을 빼면 매입원금(달러)이
                  // 정확히 나온다 — 매입 시점 환율을 몰라도 되는 정확한 계산.
                  const marketValueUsd = tossData.marketValueKrw / tossData.usdKrwRate;
                  const purchaseUsdExact = marketValueUsd - tossData.unrealizedProfitLossUsdOnly;
                  const usdRate = purchaseUsdExact > 0 ? (tossData.unrealizedProfitLossUsdOnly / purchaseUsdExact) * 100 : null;
                  return (
                    <>
                      <div className="rounded-xl px-4 py-3.5" style={{ backgroundColor: C.cardAlt }}>
                        <div className="text-xs mb-1.5" style={{ color: C.muted }}>원화 기준 손익</div>
                        <div className="flex items-end justify-between gap-2">
                          <div className="text-lg" style={{ fontWeight: 700, color: tossData.unrealizedProfitLossKrw >= 0 ? C.mint : C.red, ...TAB }}>
                            {plPrivacy ? mask(plFormatSignedWon(tossData.unrealizedProfitLossKrw)) : plFormatSignedWon(tossData.unrealizedProfitLossKrw)}
                          </div>
                          <span
                            className="text-sm px-2 py-1 rounded-full shrink-0"
                            style={{ fontWeight: 700, ...TAB, color: krwRate >= 0 ? C.mint : C.red, backgroundColor: krwRate >= 0 ? C.mintTint : C.redTint }}
                          >
                            {(krwRate >= 0 ? '+' : '')}{krwRate.toFixed(2)}%
                          </span>
                        </div>
                      </div>
                      <div className="rounded-xl px-4 py-3.5" style={{ backgroundColor: C.cardAlt }}>
                        <div className="text-xs mb-1.5" style={{ color: C.muted }}>달러 기준 손익</div>
                        <div className="flex items-end justify-between gap-2">
                          <div className="text-lg" style={{ fontWeight: 700, color: tossData.unrealizedProfitLossUsdOnly >= 0 ? C.mint : C.red, ...TAB }}>
                            {plPrivacy
                              ? mask((tossData.unrealizedProfitLossUsdOnly >= 0 ? '+' : '-') + '$' + Math.abs(tossData.unrealizedProfitLossUsdOnly).toLocaleString('en-US', { maximumFractionDigits: 2 }))
                              : (tossData.unrealizedProfitLossUsdOnly >= 0 ? '+' : '-') + '$' + Math.abs(tossData.unrealizedProfitLossUsdOnly).toLocaleString('en-US', { maximumFractionDigits: 2 })}
                          </div>
                          {usdRate !== null && (
                            <span
                              className="text-sm px-2 py-1 rounded-full shrink-0"
                              style={{ fontWeight: 700, ...TAB, color: usdRate >= 0 ? C.mint : C.red, backgroundColor: usdRate >= 0 ? C.mintTint : C.redTint }}
                            >
                              {(usdRate >= 0 ? '+' : '')}{usdRate.toFixed(2)}%
                            </span>
                          )}
                        </div>
                        <div className="text-[10px] mt-1.5" style={{ color: C.faint }}>환율 변동 효과(원화 기준)를 뺀, 순수 주가 등락 기준 수익률이에요.</div>
                      </div>
                    </>
                  );
                })()}
                <div className="flex items-center justify-between rounded-xl px-4 py-3.5" style={{ backgroundColor: C.cardAlt }}>
                  <span className="text-xs" style={{ color: C.muted }}>현재 환율 (USD/KRW)</span>
                  <span className="text-sm" style={{ fontWeight: 700, ...TAB }}>{tossData.usdKrwRate.toLocaleString('ko-KR')}원</span>
                </div>
                <div className="text-[11px] pt-1 text-center" style={{ color: C.faint }}>
                  {new Date(tossData.updatedAt).toLocaleString('ko-KR')} 기준 · 토스증권 API
                </div>
              </div>
            </div>
          </div>
        )}

        {/* 전체화면 오버레이: 연간 목록 / 연도 상세 / 장기목표 편집 */}
        {fullView && (
          <div className="fixed inset-0 z-50 overflow-y-auto" style={{ backgroundColor: C.bg }}>
            <div className="max-w-md mx-auto min-h-screen px-5 pt-6" style={{ paddingBottom: 40 }}>
              <div className="flex items-center gap-3 mb-6">
                <button
                  onClick={() => {
                    if (fullView === 'yearDetail') { setFullView('yearlyList'); setSelectedYear(null); }
                    else { setFullView(null); setSelectedYear(null); }
                  }}
                  className="rounded-lg flex items-center justify-center" style={{ width: 34, height: 34, backgroundColor: C.cardAlt }}
                >
                  <ChevronLeft size={16} />
                </button>
                <div className="text-base" style={{ fontWeight: 700 }}>
                  {fullView === 'yearlyList' ? '연간 수익 전체보기' : fullView === 'yearDetail' ? (selectedYear + '년 수익 상세') : fullView === 'bulkTag' ? '미분류 기록 태그하기' : '장기 목표 설정'}
                </div>
              </div>

              {fullView === 'yearlyList' && (
                <div className="space-y-2.5">
                  {d.yearList.map((yStr) => {
                    const total = d.yearlyTotals[yStr] || 0;
                    const target = yearlyTargets[yStr] || 0;
                    const pct = target > 0 ? (total / target) * 100 : 0;
                    return (
                      <button
                        key={yStr} onClick={() => { setSelectedYear(Number(yStr)); setFullView('yearDetail'); }}
                        className="w-full flex items-center justify-between rounded-xl px-4 py-4 text-left" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}
                      >
                        <div className="min-w-0">
                          <div className="text-sm" style={{ fontWeight: 700 }}>{yStr}년</div>
                          {target > 0
                            ? <div className="text-xs mt-1" style={{ color: pct < 100 ? C.muted : C.mint }}>목표 {plFormatComma(target)}원 · {pct.toFixed(1)}% 달성</div>
                            : <div className="text-xs mt-1" style={{ color: C.faint }}>목표 미설정</div>}
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="text-sm" style={{ fontWeight: 700, color: total >= 0 ? C.mint : C.red, ...TAB }}>{plFormatSignedWon(total)}</span>
                          <ChevronRight size={14} style={{ color: C.faint }} />
                        </div>
                      </button>
                    );
                  })}
                </div>
              )}

              {fullView === 'yearDetail' && (() => {
                const yy = selectedYear;
                const yTotal = d.yearlyTotals[String(yy)] || 0;
                const yTarget = yearlyTargets[String(yy)] || 0;
                const yPct = yTarget > 0 ? (yTotal / yTarget) * 100 : 0;
                const yRemaining = yTarget - yTotal;
                const monthly = plMonthlyTotalsForYear(d.sorted, yy);
                const maxMonth = (yy === d.currentYearNum) ? (new Date().getMonth() + 1) : 12;
                const rows = [];
                for (let mi = 0; mi < maxMonth; mi++) {
                  if (!monthly.hasAny[mi] && yy === d.currentYearNum && mi === maxMonth - 1) continue;
                  rows.push(mi);
                }
                return (
                  <div className="space-y-5">
                    <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
                      <div className="flex items-center justify-between px-4 py-3" style={{ borderBottom: `1px solid ${C.border}` }}>
                        <span className="text-xs" style={{ color: C.muted }}>총 수익</span>
                        <span className="text-sm" style={{ fontWeight: 700, color: C.mint, ...TAB }}>{plFormatSignedWon(yTotal)}</span>
                      </div>
                      <div className="flex items-center justify-between px-4 py-3" style={{ borderBottom: `1px solid ${C.border}` }}>
                        <span className="text-xs" style={{ color: C.muted }}>연간 목표</span>
                        <div className="flex items-center px-2.5 rounded-lg" style={{ backgroundColor: C.cardAlt, height: 34, width: 160 }}>
                          <input
                            type="text" inputMode="numeric" placeholder="미설정" value={yTarget ? plFormatComma(yTarget) : ''}
                            onChange={(e) => { const dgt = e.target.value.replace(/[^0-9]/g, ''); setYearTarget(yy, dgt === '' ? null : Number(dgt)); }}
                            className="flex-1 min-w-0 bg-transparent outline-none text-xs text-right" style={TAB}
                          />
                          <span className="text-[10px] ml-1" style={{ color: C.faint }}>원</span>
                        </div>
                      </div>
                      <div className="flex items-center justify-between px-4 py-3" style={{ borderBottom: `1px solid ${C.border}` }}>
                        <span className="text-xs" style={{ color: C.muted }}>달성률</span>
                        <span className="text-sm" style={{ fontWeight: 700, color: yPct >= 100 ? C.mint : C.white }}>{yTarget > 0 ? (yPct.toFixed(1) + '%' + (yPct >= 100 ? ' 🏅' : '')) : '-'}</span>
                      </div>
                      <div className="flex items-center justify-between px-4 py-3">
                        <span className="text-xs" style={{ color: C.muted }}>남은 금액</span>
                        <span className="text-sm" style={{ fontWeight: 700 }}>{yTarget > 0 ? plFormatComma(Math.max(0, yRemaining)) + '원' : '-'}</span>
                      </div>
                    </div>
                    <div>
                      <div className="text-sm mb-2" style={{ fontWeight: 700 }}>월별 수익 내역</div>
                      {rows.length === 0 && <div className="text-xs" style={{ color: C.faint }}>이 연도엔 아직 기록이 없어요.</div>}
                      <div className="space-y-2">
                        {rows.map((mi) => (
                          <div key={mi} className="flex items-center justify-between rounded-lg px-4 py-3" style={{ backgroundColor: C.cardAlt }}>
                            <span className="text-xs" style={{ color: C.soft }}>{PL_MONTH_NAMES[mi]}</span>
                            <span className="text-sm" style={{ fontWeight: 700, color: monthly.totals[mi] >= 0 ? C.mint : C.red, ...TAB }}>{plFormatSignedWon(monthly.totals[mi])}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                );
              })()}

              {fullView === 'bulkTag' && (
                <div className="space-y-3">
                  <div className="text-xs leading-relaxed rounded-xl px-4 py-3.5" style={{ backgroundColor: C.cardAlt, color: C.soft }}>
                    카테고리가 없는 기록들이에요. 각 기록의 자산군을 골라주면 실현손익 분포에 반영돼요.
                  </div>

                  <div className="flex gap-2">
                    {PL_PROFIT_CATEGORIES.map((c) => (
                      <button
                        key={c.key}
                        onClick={() => {
                          const all = {};
                          untaggedEntries.forEach((e) => { all[e.date] = c.key; });
                          setBulkSelected(all);
                        }}
                        className="flex-1 text-[11px] px-2 py-2 rounded-lg"
                        style={{ backgroundColor: C.cardAlt, border: `1px solid ${C.border}`, color: C.soft, fontWeight: 600 }}
                      >
                        전부 {c.label}
                      </button>
                    ))}
                  </div>

                  {untaggedEntries.map((e) => (
                    <div key={e.date} className="rounded-xl px-4 py-3" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
                      <div className="flex items-center justify-between mb-2.5">
                        <span className="text-xs" style={{ color: C.muted }}>{plFormatDateLabel(e.date)}</span>
                        <span className="text-sm" style={{ fontWeight: 700, color: e.delta >= 0 ? C.mint : C.red, ...TAB }}>{plFormatSignedWon(e.delta)}</span>
                      </div>
                      <div className="flex gap-1.5">
                        {PL_PROFIT_CATEGORIES.map((c) => {
                          const on = bulkSelected[e.date] === c.key;
                          return (
                            <button
                              key={c.key}
                              onClick={() => setBulkSelected((prev) => ({ ...prev, [e.date]: on ? undefined : c.key }))}
                              className="flex-1 text-[11px] px-2 py-1.5 rounded-full flex items-center justify-center gap-1"
                              style={{ backgroundColor: on ? c.color : C.cardAlt, border: `1px solid ${on ? c.color : C.border}`, color: on ? C.bg : C.faint, fontWeight: 600 }}
                            >
                              <span className="rounded-full" style={{ width: 5, height: 5, backgroundColor: on ? C.bg : c.color, display: 'inline-block' }} />
                              {c.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}

                  {untaggedEntries.length === 0 && (
                    <div className="text-xs text-center py-8" style={{ color: C.faint }}>미분류 기록이 없어요.</div>
                  )}

                  {untaggedEntries.length > 0 && (
                    <button
                      onClick={() => { applyBulkTags(); setFullView(null); }}
                      className="w-full py-3.5 rounded-xl text-sm mt-2"
                      style={{ backgroundColor: C.brand, color: C.brandDark, fontWeight: 700 }}
                    >
                      {Object.values(bulkSelected).filter(Boolean).length}건 저장
                    </button>
                  )}
                </div>
              )}

              {fullView === 'longtermEdit' && (
                <div className="space-y-4">
                  <div className="text-xs leading-relaxed rounded-xl px-4 py-3.5" style={{ backgroundColor: C.cardAlt, color: C.soft }}>
                    3년/5년/10년 목표는 연간 수익을 자동으로 합산해서 진행률을 계산해요. 목표가 끝난 뒤에도 기록은 그대로 보존되고, 새 목표를 다시 시작할 수 있어요.
                  </div>
                  {d.longtermCards.map((c) => (
                    <div key={c.duration} className="rounded-xl p-4" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-sm" style={{ fontWeight: 700 }}>{c.duration}년 목표</span>
                        {c.completed && <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ backgroundColor: C.brand, color: C.brandDark, fontWeight: 700 }}>완료</span>}
                      </div>
                      {c.completed ? (
                        <>
                          <div className="text-xs mb-3" style={{ color: C.faint }}>{c.baseYear}~{c.endYear} · 종료됨</div>
                          <div className="rounded-lg overflow-hidden mb-3" style={{ backgroundColor: C.cardAlt }}>
                            <div className="flex items-center justify-between px-3 py-2.5"><span className="text-xs" style={{ color: C.muted }}>최종 누적 수익</span><span className="text-xs" style={{ fontWeight: 700, color: C.mint }}>{plFormatSignedWon(c.sum)}</span></div>
                            <div className="flex items-center justify-between px-3 py-2.5"><span className="text-xs" style={{ color: C.muted }}>목표</span><span className="text-xs" style={{ fontWeight: 700 }}>{plFormatComma(c.target)}원</span></div>
                            <div className="flex items-center justify-between px-3 py-2.5"><span className="text-xs" style={{ color: C.muted }}>달성률</span><span className="text-xs" style={{ fontWeight: 700 }}>{c.pct.toFixed(1)}%</span></div>
                          </div>
                          <button onClick={() => renewGoal(String(c.duration))} className="w-full py-2.5 rounded-lg text-xs" style={{ backgroundColor: C.brand, color: C.brandDark, fontWeight: 700 }}>새 {c.duration}년 목표 만들기</button>
                        </>
                      ) : (
                        <>
                          <div className="grid grid-cols-2 gap-3 mb-3 mt-2">
                            <div>
                              <label className="text-[11px] mb-1 block" style={{ color: C.faint }}>기준연도</label>
                              <input
                                type="number" defaultValue={c.baseYear}
                                onBlur={(e) => { const num = Number(e.target.value); if (num && num >= 1900 && num <= 3000) setLongtermField(String(c.duration), 'baseYear', num); }}
                                className="w-full px-3 py-2.5 text-sm rounded-lg" style={{ backgroundColor: C.cardAlt, border: `1px solid ${C.border}` }}
                              />
                            </div>
                            <div>
                              <label className="text-[11px] mb-1 block" style={{ color: C.faint }}>목표금액</label>
                              <div className="flex items-center px-3 rounded-lg" style={{ backgroundColor: C.cardAlt, border: `1px solid ${C.border}`, height: 42 }}>
                                <input
                                  type="text" inputMode="numeric" value={c.target ? plFormatComma(c.target) : ''}
                                  onChange={(e) => { const dgt = e.target.value.replace(/[^0-9]/g, ''); setLongtermField(String(c.duration), 'target', dgt === '' ? 0 : Number(dgt)); }}
                                  className="flex-1 min-w-0 bg-transparent outline-none text-sm" style={TAB}
                                />
                              </div>
                            </div>
                          </div>
                          <div className="text-xs mb-3" style={{ color: C.faint }}>기간: {c.baseYear}~{c.endYear}</div>
                          <div className="rounded-lg overflow-hidden" style={{ backgroundColor: C.cardAlt }}>
                            <div className="flex items-center justify-between px-3 py-2.5"><span className="text-xs" style={{ color: C.muted }}>현재 누적</span><span className="text-xs" style={{ fontWeight: 700, color: C.mint }}>{plFormatSignedWon(c.sum)}</span></div>
                            <div className="flex items-center justify-between px-3 py-2.5"><span className="text-xs" style={{ color: C.muted }}>달성률</span><span className="text-xs" style={{ fontWeight: 700 }}>{c.pct.toFixed(1)}%</span></div>
                            <div className="flex items-center justify-between px-3 py-2.5"><span className="text-xs" style={{ color: C.muted }}>남은 금액</span><span className="text-xs" style={{ fontWeight: 700 }}>{plFormatComma(c.remaining)}원</span></div>
                          </div>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* -------------------------------- app --------------------------------- */

function AssetApp({ tab, setTab, tossUrl, saveTossUrl, upbitUrl, saveUpbitUrl, theme, setTheme }) {
  const [records, setRecords] = useState([]);
  const [hidden, setHidden] = useState(new Set());
  const [ready, setReady] = useState(false);
  const [editing, setEditing] = useState(null);
  const [range, setRange] = useState('all');
  const [privacy, setPrivacy] = useState(false);
  const [toast, setToast] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);
  const [plEntries, setPlEntries] = useState([]);
  const [autoBackupAt, setAutoBackupAt] = useState(null);
  const [cloudBackupAt, setCloudBackupAt] = useState(null);
  const [cloudBackupBusy, setCloudBackupBusy] = useState(false);
  const [cloudBackupMsg, setCloudBackupMsg] = useState('');
  const fileInputRef = useRef(null);

  useEffect(() => {
    getCloudBackupMeta().then((meta) => { if (meta && meta.savedAt) setCloudBackupAt(meta.savedAt); });
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  }, []);

  useEffect(() => {
    (async () => {
      let r = null;
      try {
        const res = await window.storage.get(RECORDS_KEY, false);
        r = res ? JSON.parse(res.value) : null;
      } catch { r = null; }
      if (!r) {
        r = seedRecords();
        try { await window.storage.set(RECORDS_KEY, JSON.stringify(r), false); } catch {}
      }
      setRecords(r);

      let h = new Set();
      try {
        const res = await window.storage.get(HIDDEN_KEY, false);
        h = res ? new Set(JSON.parse(res.value)) : new Set();
      } catch { h = new Set(); }
      setHidden(h);
      setReady(true);

      // 손익(수익) 탭의 일간 수익 원장은 읽기 전용으로만 가져온다 — 여기서 절대 쓰지 않는다.
      // '현재 순자산'은 이 원장을 기반으로 매번 새로 계산되는 값이지, 저장된 실물 숫자가 아니다.
      let pl = [];
      try {
        const pr = await window.storage.get(PL_ENTRIES_KEY, false);
        pl = pr ? JSON.parse(pr.value) : [];
      } catch { pl = []; }
      setPlEntries(pl);

      // 자동 백업: 앱을 열 때 현재 원본 데이터(자산 스냅샷 + 손익 원장)를 통째로 별도 키에
      // 복사해 둔다. 실수로 초기화했을 때 되돌리기 위한 안전장치로, 원본은 건드리지 않는다.
      try {
        const snap = { savedAt: new Date().toISOString(), records: r, plEntries: pl };
        await window.storage.set(AUTO_BACKUP_KEY, JSON.stringify(snap), false);
        setAutoBackupAt(snap.savedAt);
      } catch {}

      // 클라우드 백업: localStorage 바깥(Cloudflare KV)에도 같이 올려서, 이 기기/브라우저
      // 자체에 문제가 생겨도 복구할 수 있게 한다. 실패해도 앱 사용에는 지장 없게 조용히 넘어간다.
      pushCloudBackupThrottled({ savedAt: new Date().toISOString(), records: r, hidden: [...h], plEntries: pl })
        .then((res) => { if (res) setCloudBackupAt(new Date().toISOString()); })
        .catch(() => {});
    })();
  }, []);

  const persistRecords = useCallback(async (next) => {
    setRecords(next);
    try { await window.storage.set(RECORDS_KEY, JSON.stringify(next), false); } catch {}
  }, []);
  const persistHidden = useCallback(async (nextSet) => {
    setHidden(nextSet);
    try { await window.storage.set(HIDDEN_KEY, JSON.stringify([...nextSet]), false); } catch {}
  }, []);

  const manualCloudBackup = useCallback(async () => {
    setCloudBackupBusy(true);
    setCloudBackupMsg('');
    try {
      await pushCloudBackup({ savedAt: new Date().toISOString(), records, hidden: [...hidden], plEntries });
      setCloudBackupAt(new Date().toISOString());
      setCloudBackupMsg('백업했어요.');
    } catch {
      setCloudBackupMsg('백업 실패 — 네트워크를 확인해주세요.');
    } finally {
      setCloudBackupBusy(false);
    }
  }, [records, hidden, plEntries]);

  const manualCloudRestore = useCallback(async () => {
    if (!window.confirm('클라우드 백업으로 복원하면 지금 이 기기의 데이터를 덮어써요. 계속할까요?')) return;
    setCloudBackupBusy(true);
    setCloudBackupMsg('');
    try {
      const data = await pullCloudBackup();
      if (!data || !Array.isArray(data.records)) {
        setCloudBackupMsg('복원할 백업이 없어요.');
        return;
      }
      await persistRecords(data.records);
      if (Array.isArray(data.hidden)) await persistHidden(new Set(data.hidden));
      if (Array.isArray(data.plEntries)) {
        setPlEntries(data.plEntries);
        try { await window.storage.set(PL_ENTRIES_KEY, JSON.stringify(data.plEntries), false); } catch {}
      }
      setCloudBackupMsg('복원했어요.');
    } catch {
      setCloudBackupMsg('복원 실패 — 네트워크를 확인해주세요.');
    } finally {
      setCloudBackupBusy(false);
    }
  }, [persistRecords, persistHidden]);

  const sorted = useMemo(
    () => [...records].sort((a, b) => a.recordDate.localeCompare(b.recordDate)),
    [records]
  );
  const latest = sorted[sorted.length - 1] || null;
  const prev = sorted[sorted.length - 2] || null;

  const netWorthOf = useCallback(
    (rec) => CATEGORIES.reduce((s, c) => (hidden.has(c.key) ? s : s + assetValue(rec, c.key)), 0),
    [hidden]
  );
  // 평가손익(투자 자산 6개, 원금 대비) - 스냅샷 값
  const pnlTotalOf = useCallback(
    (rec) => PNL_CATEGORIES.reduce((s, c) => (hidden.has(c.key) ? s : s + evalPnl(rec, c.key)), 0),
    [hidden]
  );
  // 원금 기준 순자산(투자자산은 원금, 비투자자산은 현재값) - "투입 원금" 라인용
  const principalNetWorthOf = useCallback((rec) => {
    const investPrincipal = INVEST_CATEGORIES.reduce((s, c) => {
      if (hidden.has(c.key)) return s;
      if (rec.principal && c.key in rec.principal) return s + (rec.principal[c.key] || 0);
      if (rec.assets && rec.pnl) return s + ((rec.assets[c.key] || 0) - (rec.pnl[c.key] || 0));
      return s + assetValue(rec, c.key);
    }, 0);
    const nonInvest = NONINVEST_CATEGORIES.reduce((s, c) => (hidden.has(c.key) ? s : s + assetValue(rec, c.key)), 0);
    return investPrincipal + nonInvest;
  }, [hidden]);

  const latestNW = latest ? netWorthOf(latest) : 0;
  // "전년 대비"는 직전 분기가 아니라 정말 1년 전(작년) 기준이어야 한다.
  // latest 기준 연도-1에 해당하는 기록 중 가장 최근 것을 찾는다.
  const prevYearRec = (() => {
    if (!latest) return null;
    const targetYear = String(Number(latest.recordDate.slice(0, 4)) - 1);
    const candidates = sorted.filter((r) => r.recordDate.slice(0, 4) === targetYear);
    return candidates.length ? candidates[candidates.length - 1] : null;
  })();
  const prevNW = prevYearRec ? netWorthOf(prevYearRec) : null;
  const yoyDiff = prevNW !== null ? latestNW - prevNW : null;
  const yoyPct = prevNW ? (yoyDiff / prevNW) * 100 : null;
  const latestPnl = latest ? pnlTotalOf(latest) : 0;

  /* --------------------------------------------------------------------
     "현재 순자산" 계산 로직 (스냅샷/원장 분리 원칙)
     - AssetSnapshot(월별 자산 기록)의 원본 숫자는 절대 직접 수정하지 않는다.
     - ProfitRecord(손익 탭의 일간 수익 원장)도 원본 그대로 둔다.
     - 현재 순자산 = 가장 최근 자산 스냅샷의 순자산 + 그 스냅샷 이후에 쌓인 수익 합계.
       (스냅샷의 recordDate는 'YYYY-MM' 월 단위라서, 스냅샷 월까지의 수익은 이미
        그 달 실제 자산 입력에 반영된 것으로 보고, 스냅샷 월보다 "이후" 월의
        수익만 더한다 — 중복 합산 방지.)
     - 손익 원장을 나중에 수정/삭제해도 이 값은 항상 원본 데이터로부터 다시 계산되므로
       별도의 되돌리기 로직이 필요 없다.
  -------------------------------------------------------------------- */
  const sinceSnapshotProfit = useMemo(() => {
    if (!latest) return 0;
    return plEntries
      .filter((e) => e.date.slice(0, 7) > latest.recordDate)
      .reduce((s, e) => s + e.delta, 0);
  }, [plEntries, latest]);

  /* 미국주식 평가액 변동 반영 (토스 실시간)
     스냅샷에 적힌 current.usStock은 "스냅샷 찍은 시점의 평가액"이므로,
     지금 토스가 알려주는 평가액과의 '차이'만 더하면 이중 계산 없이 최신화된다.
     토스를 못 불러오면 0 → 기존 계산식 그대로 동작한다. */
  const [tossLive, setTossLive] = useState(null);
  useEffect(() => {
    let alive = true;
    fetchTossSummary(tossUrl).then((dta) => { if (alive) setTossLive(dta); }).catch(() => {});
    return () => { alive = false; };
  }, [tossUrl]);
  const usStockDrift = useMemo(() => {
    if (!latest || !tossLive) return 0;
    const snapshotUs = latest.current?.usStock || 0;
    if (!snapshotUs) return 0;
    return Math.round(tossLive.marketValueKrw - snapshotUs);
  }, [latest, tossLive]);

  const currentNetWorth = latestNW + sinceSnapshotProfit + usStockDrift;

  // 카테고리별 누적 실현손익 = 일별 기록에 태그된 수익을 전체 기간(역대) 합산 (자산 스냅샷과는 무관, 순수 실현손익).
  const categoryAssetTotals = useMemo(() => {
    return BAR_PNL_CATEGORIES.map((c) => {
      const total = plEntries.reduce((s, e) => s + (plCategoryAmountsOf(e)[c.key] || 0), 0);
      return { ...c, total };
    });
  }, [plEntries]);

  const todayMonthKey = plTodayStr().slice(0, 7);
  const thisMonthProfit = useMemo(
    () => plEntries.filter((e) => e.date.slice(0, 7) === todayMonthKey).reduce((s, e) => s + e.delta, 0),
    [plEntries, todayMonthKey]
  );

  const rangedRecords = useMemo(() => {
    if (!latest) return [];
    if (range === 'all') return sorted;
    const years = range === '1y' ? 1 : range === '3y' ? 3 : 5;
    const cutoff = toDate(latest.recordDate);
    cutoff.setFullYear(cutoff.getFullYear() - years);
    return sorted.filter((r) => toDate(r.recordDate) >= cutoff);
  }, [sorted, range, latest]);

  const growthSeries = rangedRecords.map((r) => ({
    ...humanPeriod(r.recordDate),
    netWorth: netWorthOf(r),
    principal: principalNetWorthOf(r),
  }));

  const donutData = useMemo(() => {
    if (!latest) return [];
    return CATEGORIES.filter((c) => !hidden.has(c.key) && assetValue(latest, c.key) > 0).map(
      (c) => ({ name: c.label, value: assetValue(latest, c.key), color: c.color })
    );
  }, [latest, hidden]);
  const donutTotal = donutData.reduce((s, d) => s + d.value, 0);

  // 홈 "투자 성과"는 "올해 누적 손익"을 보여준다. 각 분기 기록의 annualPnl은
  // "그 분기까지의 누적 실현손익" 스냅샷이라, 올해 기록된 분기를 그냥 더하면
  // 중복 합산된다. 그래서 (최신 누적값 - 작년 말 시점 누적값)으로 올해 증가분만 계산한다.
  const yearlyPnl = useMemo(() => {
    if (!latest) return {};
    const yr = latest.recordDate.slice(0, 4);
    const beforeYear = sorted.filter((r) => r.recordDate.slice(0, 4) < yr);
    const baseline = beforeYear.length ? beforeYear[beforeYear.length - 1] : null;
    return BAR_PNL_CATEGORIES.reduce((acc, c) => {
      if (hidden.has(c.key)) return { ...acc, [c.key]: 0 };
      const cur = annualPnlOf(latest, c.key);
      const base = baseline ? annualPnlOf(baseline, c.key) : 0;
      return { ...acc, [c.key]: cur - base };
    }, {});
  }, [latest, sorted, hidden]);

  const pnlMax = latest ? Math.max(1, ...BAR_PNL_CATEGORIES.map((c) => Math.abs(yearlyPnl[c.key] || 0))) : 1;
  const pnlProfit = latest ? BAR_PNL_CATEGORIES.reduce((s, c) => s + Math.max(0, yearlyPnl[c.key] || 0), 0) : 0;
  const pnlLoss = latest ? BAR_PNL_CATEGORIES.reduce((s, c) => s + Math.max(0, -(yearlyPnl[c.key] || 0)), 0) : 0;

  const pnlDetail = useMemo(() => {
    if (!latest) return [];
    return PNL_CATEGORIES.filter((c) => !hidden.has(c.key)).map((c) => ({ ...c, value: evalPnl(latest, c.key) }));
  }, [latest, hidden]);

  const pnlShareByKey = useMemo(() => {
    const map = {};
    donutData.forEach((d) => { map[d.name] = donutTotal ? Math.round((d.value / donutTotal) * 100) : 0; });
    return map;
  }, [donutData, donutTotal]);

  const maxRec = sorted.length ? sorted.reduce((m, r) => (netWorthOf(r) > netWorthOf(m) ? r : m)) : null;
  const minRec = sorted.length ? sorted.reduce((m, r) => (netWorthOf(r) < netWorthOf(m) ? r : m)) : null;
  // 각 분기 기록의 annualPnl은 "그 분기까지의 누적 실현손익"을 담고 있으므로
  // (증분이 아니라 스냅샷), 여러 분기를 그냥 더하면 중복 합산된다.
  // 총 누적 손익은 가장 최근 분기 기록의 값을 그대로 쓴다.
  const cumPnl = latest
    ? BAR_PNL_CATEGORIES.reduce((s, c) => (hidden.has(c.key) ? s : s + annualPnlOf(latest, c.key)), 0)
    : 0;
  const firstRec = sorted[0] || null;
  const sinceFirstPct = firstRec && netWorthOf(firstRec)
    ? ((latestNW - netWorthOf(firstRec)) / netWorthOf(firstRec)) * 100 : null;

  const netWorthLineSeries = sorted.map((r) => ({ ...humanPeriod(r.recordDate), netWorth: netWorthOf(r) }));
  // 분기별 자산 흐름: "원금 대비 평가손익"(evalPnl)을 분기마다 그대로 보여준다.
  // 델타(증감분)로 계산하면 비교 대상이 없는 첫 분기만 절대값이 섞여 단위가 안 맞았기 때문에,
  // 모든 막대를 같은 기준(그 분기 시점의 평가손익 절대값)으로 통일했다 — 막대가 오르내리는
  // 모양 자체로 흐름이 보인다.
  const pnlBarSeries = sorted.map((r) => ({ axis: humanPeriod(r.recordDate).axis, pnl: pnlTotalOf(r) }));

  const cumByCategory = BAR_PNL_CATEGORIES.map((c) => ({
    ...c,
    total: latest ? (hidden.has(c.key) ? 0 : annualPnlOf(latest, c.key)) : 0,
  }));
  const yearSpan = firstRec && latest
    ? Math.max(1, parseInt(latest.recordDate.slice(0, 4), 10) - parseInt(firstRec.recordDate.slice(0, 4), 10) + 1)
    : 1;

  function openNew() {
    setEditing({
      id: null, period: '', recordDate: '', note: '',
      principal: emptyPrincipal(), current: emptyCurrent(), nonInvest: emptyNonInvest(), annualPnl: emptyAnnualPnl(),
    });
  }
  function openEdit(rec) {
    // 예전 형식(assets/pnl)으로 저장된 기록도 새 입력 형태로 자동 변환해서 열어줌
    const principal = rec.principal || INVEST_CATEGORIES.reduce((acc, c) => ({
      ...acc, [c.key]: rec.assets && rec.pnl ? (rec.assets[c.key] || 0) - (rec.pnl[c.key] || 0) : 0,
    }), {});
    const current = rec.current || INVEST_CATEGORIES.reduce((acc, c) => ({
      ...acc, [c.key]: rec.assets ? rec.assets[c.key] || 0 : 0,
    }), {});
    const nonInvest = rec.nonInvest || NONINVEST_CATEGORIES.reduce((acc, c) => ({
      ...acc, [c.key]: rec.assets ? rec.assets[c.key] || 0 : 0,
    }), {});
    const annualPnl = rec.annualPnl || BAR_PNL_CATEGORIES.reduce((acc, c) => ({
      ...acc, [c.key]: rec.pnl ? rec.pnl[c.key] || 0 : 0,
    }), {});
    setEditing(JSON.parse(JSON.stringify({
      id: rec.id, period: rec.period, recordDate: rec.recordDate, note: rec.note || '',
      principal, current, nonInvest, annualPnl,
    })));
  }
  async function saveEditing() {
    if (!editing.period.trim() || !editing.recordDate) { showToast('기간과 기준월을 입력해주세요'); return; }
    let next;
    if (editing.id) next = records.map((r) => (r.id === editing.id ? editing : r));
    else next = [...records, { ...editing, id: `rec-${Date.now()}` }];
    await persistRecords(next);
    setEditing(null);
    showToast('저장했어요');
  }
  async function deleteRecord(id) {
    if (!window.confirm('이 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
    await persistRecords(records.filter((r) => r.id !== id));
    showToast('삭제했어요');
  }

  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function exportJson() {
    // 자산 스냅샷 + 손익 원장 + 표시설정을 한 파일에 담는다 (통합 백업).
    downloadBlob(JSON.stringify({ records, hidden: [...hidden], plEntries }, null, 2),
      `my-asset-backup-${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
    showToast('JSON 백업을 저장했어요');
  }
  function exportCsv() {
    const header = [
      'period', 'recordDate', 'note',
      ...INVEST_CATEGORIES.map((c) => `${c.label} 원금`),
      ...INVEST_CATEGORIES.map((c) => `${c.label} 현재평가액`),
      ...NONINVEST_CATEGORIES.map((c) => c.label),
      ...BAR_PNL_CATEGORIES.map((c) => `${c.label} 분기별손익`),
    ];
    const rows = sorted.map((r) => [
      r.period, r.recordDate, JSON.stringify(r.note || ''),
      ...INVEST_CATEGORIES.map((c) => (r.principal ? r.principal[c.key] || 0 : assetValue(r, c.key))),
      ...INVEST_CATEGORIES.map((c) => assetValue(r, c.key)),
      ...NONINVEST_CATEGORIES.map((c) => assetValue(r, c.key)),
      ...BAR_PNL_CATEGORIES.map((c) => annualPnlOf(r, c.key)),
    ]);
    const csv = [header.join(','), ...rows.map((row) => row.join(','))].join('\n');
    downloadBlob('\uFEFF' + csv, `my-asset-records-${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv');
    showToast('CSV를 저장했어요');
  }
  function triggerImport() { fileInputRef.current?.click(); }
  async function handleImportFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.records)) throw new Error('invalid');
      if (!window.confirm('불러온 기록으로 현재 데이터를 덮어쓸까요?')) return;
      await persistRecords(parsed.records);
      if (Array.isArray(parsed.hidden)) await persistHidden(new Set(parsed.hidden));
      if (Array.isArray(parsed.plEntries)) {
        const valid = parsed.plEntries.filter((en) => en && typeof en.date === 'string' && typeof en.delta === 'number');
        setPlEntries(valid);
        try { await window.storage.set(PL_ENTRIES_KEY, JSON.stringify(valid), false); } catch {}
      }
      showToast('불러오기를 완료했어요');
    } catch { showToast('파일을 읽을 수 없어요'); }
    finally { e.target.value = ''; }
  }
  async function resetAll() {
    await persistRecords([]);
    setConfirmReset(false);
    showToast('모든 기록을 삭제했어요');
  }
  function toggleHidden(key) {
    const next = new Set(hidden);
    next.has(key) ? next.delete(key) : next.add(key);
    persistHidden(next);
  }
  function showAll() { persistHidden(new Set()); }
  function hideAll() { persistHidden(new Set(CATEGORIES.map((c) => c.key))); }

  if (!ready) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: C.bg }}>
        <div className="text-sm" style={{ color: C.brand, letterSpacing: '0.2em' }}>LOADING...</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: C.bg, color: C.white, fontFamily: BODY_FONT }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; }
        .rounded-2xl, .rounded-xl { box-shadow: ${C.cardShadow}; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: ${C.scrollThumb}; border-radius: 999px; }
        input, textarea { color: ${C.white}; }
        input::placeholder, textarea::placeholder { color: ${C.placeholder}; }
        input[type=month]::-webkit-calendar-picker-indicator { filter: ${C.dateIcon}; }
        button { color: inherit; font-family: inherit; }
      `}</style>

      <div className="max-w-md mx-auto min-h-screen flex flex-col relative">
        {toast && (
          <div
            className="fixed left-1/2 z-50 text-sm px-4 py-2 rounded-full shadow-lg"
            style={{ top: 16, transform: 'translateX(-50%)', backgroundColor: C.brand, color: C.brandDark, fontWeight: 600 }}
          >
            {toast}
          </div>
        )}

        <div className="flex-1 overflow-y-auto px-5 pt-6" style={{ paddingBottom: 116 }}>
          <TopHeader theme={theme} setTheme={setTheme} />

          {tab === 'home' && (
            <HomeTab
              latest={latest} latestNW={latestNW} yoyDiff={yoyDiff} yoyPct={yoyPct}
              currentNetWorth={currentNetWorth} sinceSnapshotProfit={sinceSnapshotProfit} thisMonthProfit={thisMonthProfit}
              categoryAssetTotals={categoryAssetTotals}
              usStockDrift={usStockDrift} plEntries={plEntries}
              latestPnl={latestPnl} privacy={privacy} setPrivacy={setPrivacy}
              range={range} setRange={setRange} growthSeries={growthSeries}
              pnlMax={pnlMax} pnlProfit={pnlProfit} pnlLoss={pnlLoss} yearlyPnl={yearlyPnl}
              donutData={donutData} donutTotal={donutTotal} setTab={setTab}
              openNew={openNew} pnlDetail={pnlDetail} pnlShareByKey={pnlShareByKey}
            />
          )}
          {tab === 'records' && (
            <RecordsTab
              sorted={sorted} netWorthOf={netWorthOf} privacy={privacy}
              openNew={openNew} openEdit={openEdit} deleteRecord={deleteRecord}
            />
          )}
          {tab === 'analysis' && (
            <AnalysisTab
              sorted={sorted} maxRec={maxRec} minRec={minRec} netWorthOf={netWorthOf}
              cumPnl={cumPnl} firstRec={firstRec} latest={latest} sinceFirstPct={sinceFirstPct}
              netWorthLineSeries={netWorthLineSeries} pnlBarSeries={pnlBarSeries}
              cumByCategory={cumByCategory} yearSpan={yearSpan} privacy={privacy} openNew={openNew}
              plEntries={plEntries}
            />
          )}
          {tab === 'settings' && (
            <SettingsTab
              hidden={hidden} toggleHidden={toggleHidden} showAll={showAll} hideAll={hideAll}
              exportJson={exportJson} exportCsv={exportCsv} triggerImport={triggerImport}
              confirmReset={confirmReset} setConfirmReset={setConfirmReset} resetAll={resetAll}
              setTab={setTab} tossUrl={tossUrl} saveTossUrl={saveTossUrl} upbitUrl={upbitUrl} saveUpbitUrl={saveUpbitUrl} autoBackupAt={autoBackupAt}
              cloudBackupAt={cloudBackupAt} cloudBackupBusy={cloudBackupBusy} cloudBackupMsg={cloudBackupMsg}
              manualCloudBackup={manualCloudBackup} manualCloudRestore={manualCloudRestore}
            />
          )}
        </div>

        <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={handleImportFile} />
        {editing && <RecordEditor editing={editing} setEditing={setEditing} onSave={saveEditing} onClose={() => setEditing(null)} tossUrl={tossUrl} upbitUrl={upbitUrl} />}
      </div>
    </div>
  );
}

  return (
    <div className="space-y-9">

        <div>
          <div style={{ ...EYEBROW, color: C.brand, marginBottom: 10 }}>QUARTERLY RECORDS</div>
