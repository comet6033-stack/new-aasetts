          <p className="text-sm mt-3" style={{ color: C.muted }}>한 시점의 자산을 기록하고 긴 흐름을 남겨보세요.</p>
        </div>
      </div>

      <div className="flex items-center justify-between">
        <div>
          <div style={{ fontWeight: 700 }}>{desc.length}개의 기록</div>
          <p className="text-xs mt-1" style={{ color: C.muted }}>가장 최근 기록부터 확인할 수 있어요.</p>
        </div>
        <button
          onClick={openNew}
          className="shrink-0 rounded-full px-4 py-2.5 text-xs flex items-center gap-1.5"
          style={{ backgroundColor: C.brand, color: C.brandDark, fontWeight: 700 }}
        >
          <Plus size={14} /> 기록 추가
        </button>
      </div>

      {desc.length === 0 && <EmptyState onAdd={openNew} />}

      <div className="space-y-3">
        {desc.map((r, i) => {
          const h = humanPeriod(r.recordDate);
          const idxInSorted = sorted.length - 1 - i;
          const prevRec = idxInSorted > 0 ? sorted[idxInSorted - 1] : null;
          const diff = prevRec ? netWorthOf(r) - netWorthOf(prevRec) : null;
          return (
            <div key={r.id} className="rounded-xl p-5" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="text-base" style={{ fontWeight: 700 }}>{h.label}</span>
                    <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: C.faint, backgroundColor: C.cardAlt }}>{r.period}</span>
                  </div>
                  <div className="flex items-baseline gap-2 mt-2.5 flex-wrap">
                    <div className="text-xl" style={{ fontWeight: 700, ...TAB }}>
                      {privacy ? mask(won(netWorthOf(r))) : won(netWorthOf(r))}
                    </div>
                    {diff !== null && (
                      <span className="text-[11px]" style={{ fontWeight: 600, color: diff >= 0 ? C.mint : C.red, ...TAB }}>
                        {diff >= 0 ? '▲' : '▼'} {manSigned(diff)} · 전분기 대비
                      </span>
                    )}
                  </div>
                  <div className="text-xs mt-1" style={{ color: C.muted }}>{h.dateLine}</div>
                </div>
                <div className="flex gap-2 shrink-0">
                  <button onClick={() => openEdit(r)} className="rounded-lg flex items-center justify-center" style={{ width: 34, height: 34, backgroundColor: C.cardAlt, color: C.soft }}>
                    <Pencil size={14} />
                  </button>
                  <button onClick={() => deleteRecord(r.id)} className="rounded-lg flex items-center justify-center" style={{ width: 34, height: 34, backgroundColor: C.cardAlt, color: C.red }}>
                    <Trash2 size={14} />
                  </button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------- analysis ------------------------------ */

function AnalysisTab({
  sorted, maxRec, minRec, netWorthOf, cumPnl, firstRec, latest, sinceFirstPct,
  netWorthLineSeries, pnlBarSeries, cumByCategory, yearSpan, privacy, openNew, plEntries,
}) {
  const [quarterModal, setQuarterModal] = useState(null); // 클릭한 분기의 record
  const [categoryModal, setCategoryModal] = useState(null); // 클릭한 카테고리 { key, label, color }

  if (!latest) return <EmptyState onAdd={openNew} />;
  const years = sorted.length;
  const firstH = humanPeriod(firstRec.recordDate);
  const latestH = humanPeriod(latest.recordDate);

  const firstNW = netWorthOf(firstRec);
  const latestNWv = netWorthOf(latest);
  const monthsElapsed = Math.max(1, monthsBetween(firstRec.recordDate, latest.recordDate));
  const monthlyAvg = (latestNWv - firstNW) / monthsElapsed;
  const yearsElapsed = monthsElapsed / 12;
  const cagr = firstNW > 0 ? (Math.pow(latestNWv / firstNW, 1 / yearsElapsed) - 1) * 100 : null;

  const quarterModalItems = quarterModal
    ? PNL_CATEGORIES.map((c) => ({ ...c, value: evalPnl(quarterModal, c.key) }))
    : [];
  const quarterModalTotal = quarterModalItems.reduce((s, it) => s + it.value, 0);

  const categoryModalItems = categoryModal
    ? sorted.map((r) => ({ key: r.id, label: humanPeriod(r.recordDate).label, value: annualPnlOf(r, categoryModal.key) }))
    : [];
  const categoryModalTotal = categoryModalItems.reduce((s, it) => s + it.value, 0);

  return (
    <div className="space-y-11">
      <div>
        <div style={{ ...EYEBROW, color: C.brand, marginBottom: 10 }}>LONG-TERM VIEW</div>
        <h1 className="text-[28px]" style={DISPLAY}>장기 흐름</h1>
        <p className="text-sm mt-3" style={{ color: C.muted }}>짧은 변화보다, 쌓여온 흐름을 봅니다.</p>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <StatCard label="최고 순자산" value={eok(netWorthOf(maxRec))} sub={humanPeriod(maxRec.recordDate).label} privacy={privacy} />
        <StatCard label="최저 순자산" value={eok(netWorthOf(minRec))} sub={humanPeriod(minRec.recordDate).label} privacy={privacy} />
        <StatCard label="첫 기록 대비" value={pctSigned(sinceFirstPct)} sub={`${firstH.label.slice(2)} → ${latestH.label.slice(2)}`} accent />
        {sorted.length > 1 && (() => {
          const prevRec = sorted[sorted.length - 2];
          const prevNW = netWorthOf(prevRec);
          const qoqPct = prevNW !== 0 ? ((netWorthOf(latest) - prevNW) / Math.abs(prevNW)) * 100 : null;
          return (
            <StatCard
              label="직전 기록 대비"
              value={qoqPct !== null ? pctSigned(qoqPct) : '\u2014'}
              sub={`${humanPeriod(prevRec.recordDate).label.slice(2)} → ${latestH.label.slice(2)}`}
              accent
            />
          );
        })()}
        <StatCard label="월평균 순자산 증가액" value={`${manSigned(monthlyAvg)}원/월`} sub={`${monthsElapsed}개월 기준`} accent privacy={privacy} />
        <StatCard label="연환산 수익률 (CAGR)" value={cagr !== null ? `${pctSigned(cagr)}/연` : '\u2014'} sub={`${firstH.label.slice(2)} → ${latestH.label.slice(2)}`} accent />
      </div>

      {/* annual pnl bar */}
      <div>
        <h2 className="text-base" style={{ fontWeight: 700 }}>분기별 자산 흐름</h2>
        <p className="text-xs mt-1" style={{ color: C.muted }}>미실현손익에 대한 자산의 증감을 살펴봐요.</p>
        {(() => {
          const maxPos = Math.max(1, ...pnlBarSeries.map((d) => Math.max(0, d.pnl)));
          const maxNeg = Math.max(1, ...pnlBarSeries.map((d) => Math.max(0, -d.pnl)));
          // 위/아래 절반의 비율을 값 크기에 맞게 배분(둘 다 있으면 60/40, 한쪽만 있으면 그쪽에 대부분 할당)
          const hasNeg = pnlBarSeries.some((d) => d.pnl < 0);
          const topRatio = hasNeg ? 0.62 : 0.86;
          const chartH = 190;
          const topH = chartH * topRatio;
          const botH = chartH * (1 - topRatio);
          const labelGap = 18;
          return (
            <>
              <div className="flex items-end" style={{ height: chartH, marginTop: 18, gap: 8 }}>
                {pnlBarSeries.map((d, i) => {
                  const isNeg = d.pnl < 0;
                  const barH = Math.max(3, isNeg ? (Math.abs(d.pnl) / maxNeg) * (botH - labelGap) : (d.pnl / maxPos) * (topH - labelGap));
                  const label = privacy ? mask(moneySigned(d.pnl)) : moneySigned(d.pnl);
                  return (
                    <button
                      key={i}
                      onClick={() => setQuarterModal(sorted[i])}
                      className="flex-1 flex flex-col items-center justify-end"
                      style={{ height: chartH, position: 'relative' }}
                    >
                      {/* 위쪽 절반(양수 영역) */}
                      <div className="w-full flex flex-col items-center justify-end" style={{ height: topH }}>
                        {!isNeg && <span className="text-[11px] mb-1.5 whitespace-nowrap" style={{ fontWeight: 600, color: C.soft, ...TAB }}>{label}</span>}
                        {!isNeg && <div className="w-full rounded-t-lg" style={{ height: barH, backgroundColor: C.mint, maxWidth: 56 }} />}
                      </div>
                      {/* 기준선 */}
                      <div className="w-full" style={{ height: 1, backgroundColor: C.gridLine }} />
                      {/* 아래쪽 절반(음수 영역) */}
                      <div className="w-full flex flex-col items-center" style={{ height: botH }}>
                        {isNeg && <div className="w-full rounded-b-lg" style={{ height: barH, backgroundColor: C.red, maxWidth: 56 }} />}
                        {isNeg && <span className="text-[11px] mt-1.5 whitespace-nowrap" style={{ fontWeight: 600, color: C.soft, ...TAB }}>{label}</span>}
                      </div>
                    </button>
                  );
                })}
              </div>
              <div className="flex" style={{ gap: 8 }}>
                {pnlBarSeries.map((d, i) => (
                  <div key={i} className="flex-1 text-center text-[10px] pt-1.5" style={{ color: C.faint }}>{d.axis}</div>
                ))}
              </div>

              {/* 직전 분기 대비 증감 — 겹칠 걱정 없게 차트 아래 별도 줄로 표시 */}
              {pnlBarSeries.length > 1 && (
                <div className="mt-4 space-y-1.5">
                  {pnlBarSeries.slice(1).map((d, i) => {
                    const prevD = pnlBarSeries[i];
                    const delta = d.pnl - prevD.pnl;
                    const up = delta >= 0;
                    return (
                      <div key={i} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ backgroundColor: C.cardAlt }}>
                        <span className="text-[11px]" style={{ color: C.faint }}>{prevD.axis} → {d.axis}</span>
                        <span className="text-xs flex items-center gap-1" style={{ fontWeight: 700, color: up ? C.mint : C.red, ...TAB }}>
                          {up ? '▲' : '▼'} {privacy ? mask(moneySigned(delta)) : moneySigned(delta)}
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          );
        })()}
      </div>

      {/* 손익 원장 통계 (수익 탭 기록 기반) */}
      {plEntries && plEntries.length > 0 && (() => {
        const sortedPl = plEntries.slice().sort((a, b) => (a.date < b.date ? -1 : 1));

        // 월별 합계 (최근 12개월) — 먼저 구해서 아래 "최근 3개월 vs 이전 3개월" 비교에도 재사용한다.
        const monthlySum = {};
        sortedPl.forEach((e) => {
          const mk = e.date.slice(0, 7);
          monthlySum[mk] = (monthlySum[mk] || 0) + e.delta;
        });
        const allMonthKeys = Object.keys(monthlySum).sort();
        const monthKeys = allMonthKeys.slice(-12);
        const monthlyMax = Math.max(1, ...monthKeys.map((mk) => Math.abs(monthlySum[mk])));

        // 최근 3개월 평균 vs 그 이전 3개월 평균 (모멘텀). 기록이 "하루"가 아니라
        // "그 달 전체를 월말 하루에 몰아넣는" 방식으로도 들어오기 때문에, 일 단위가
        // 아니라 월 단위로 비교해야 실제 페이스 변화를 왜곡 없이 볼 수 있다.
        const recent3 = allMonthKeys.slice(-3);
        const prev3 = allMonthKeys.slice(-6, -3);
        const recent3Avg = recent3.length ? recent3.reduce((s, mk) => s + monthlySum[mk], 0) / recent3.length : null;
        const prev3Avg = prev3.length ? prev3.reduce((s, mk) => s + monthlySum[mk], 0) / prev3.length : null;
        const momentumPct = (recent3Avg !== null && prev3Avg) ? ((recent3Avg - prev3Avg) / Math.abs(prev3Avg)) * 100 : null;

        // 기록 금액 범위 (최고 / 최저)
        const amounts = sortedPl.map((e) => e.delta);
        const maxAmount = Math.max(...amounts);
        const minAmount = Math.min(...amounts);

        return (
          <div className="rounded-xl p-5" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
            <div style={{ fontWeight: 700 }}>매매 패턴</div>
            <p className="text-xs mt-1 mb-4" style={{ color: C.muted }}>지금까지 기록한 {sortedPl.length}건의 데이터를 분석했어요.</p>

            <div className="grid grid-cols-2 gap-3">
              <div className="rounded-lg px-3 py-2.5" style={{ backgroundColor: C.cardAlt }}>
                <div className="text-[11px] mb-1" style={{ color: C.faint }}>최근 3개월 월평균</div>
                <div className="text-sm" style={{ fontWeight: 700, color: recent3Avg === null ? C.faint : (recent3Avg >= 0 ? C.mint : C.red), ...TAB }}>
                  {recent3Avg === null ? '기록 없음' : (privacy ? mask(plFormatSignedWon(recent3Avg)) : plFormatSignedWon(recent3Avg))}
                </div>
                <div className="text-[10px] mt-1" style={{ color: momentumPct === null ? C.faint : (momentumPct >= 0 ? C.mint : C.red) }}>
                  {momentumPct === null ? '이전 3개월 비교 불가' : `이전 3개월 대비 ${momentumPct >= 0 ? '+' : ''}${momentumPct.toFixed(1)}%`}
                </div>
              </div>
              <div className="rounded-lg px-3 py-2.5" style={{ backgroundColor: C.cardAlt }}>
                <div className="text-[11px] mb-1" style={{ color: C.faint }}>기록 금액 범위</div>
                <div className="text-sm" style={{ fontWeight: 700, ...TAB }}>
                  <span style={{ color: C.mint }}>{privacy ? mask(plFormatSignedWon(maxAmount)) : plFormatSignedWon(maxAmount)}</span>
                </div>
                <div className="text-[10px] mt-1" style={{ color: C.faint }}>
                  최저 {privacy ? mask(plFormatSignedWon(minAmount)) : plFormatSignedWon(minAmount)}
                </div>
              </div>
            </div>

            <div className="text-xs mt-5 mb-3" style={{ color: C.soft, fontWeight: 600 }}>월별 손익 (최근 {monthKeys.length}개월)</div>
            <div className="space-y-2">
              {monthKeys.map((mk) => (
                <div key={mk} className="flex items-center gap-3">
                  <span className="text-[11px] w-9 shrink-0" style={{ color: C.faint }}>{mk.slice(2).replace('-', '.')}</span>
                  <div className="flex-1 rounded-full overflow-hidden" style={{ height: 6, backgroundColor: C.bgAlt }}>
                    <div
                      className="h-full rounded-full"
                      style={{
                        width: `${(Math.abs(monthlySum[mk]) / monthlyMax) * 100}%`,
                        backgroundColor: monthlySum[mk] >= 0 ? C.mint : C.red,
                      }}
                    />
                  </div>
                  <span className="text-[11px] shrink-0" style={{ color: monthlySum[mk] >= 0 ? C.mint : C.red, ...TAB, minWidth: 76, textAlign: 'right' }}>
                    {privacy ? mask(formatM(monthlySum[mk])) : formatM(monthlySum[mk])}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {/* 종목별 누적 실현손익 랭킹 */}
      {plEntries && plEntries.length > 0 && (() => {
        const stockTotals = {};
        plEntries.forEach((e) => {
          if (e.items && e.items.length) {
            e.items.forEach((it) => {
              const raw = (it.name || '').trim();
              const name = normalizeStockName(raw);
              if (name) stockTotals[name] = (stockTotals[name] || 0) + (it.amount || 0);
            });
          }
        });
        const ranked = Object.entries(stockTotals).sort((a, b) => b[1] - a[1]);
        if (!ranked.length) return null;
        const top = ranked.slice(0, 10);
        const maxAbs = Math.max(1, ...top.map(([, v]) => Math.abs(v)));
        return (
          <div className="rounded-xl p-5" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
            <div style={{ fontWeight: 700 }}>종목별 수익 랭킹</div>
            <p className="text-xs mt-1 mb-4" style={{ color: C.muted }}>종목명을 적어둔 기록만 집계했어요 (상위 {top.length}개).</p>
            <div className="space-y-2.5">
              {top.map(([name, total], i) => (
                <div key={name} className="flex items-center gap-3">
                  <span className="text-[11px] w-4 shrink-0 text-center" style={{ color: C.faint, fontWeight: 700 }}>{i + 1}</span>
                  <span className="text-xs flex-1 truncate" style={{ color: C.soft }}>{name}</span>
                  <div className="rounded-full overflow-hidden shrink-0" style={{ width: 56, height: 5, backgroundColor: C.bgAlt }}>
                    <div className="h-full rounded-full" style={{ width: `${(Math.abs(total) / maxAbs) * 100}%`, backgroundColor: total >= 0 ? C.mint : C.red, marginLeft: total >= 0 ? 0 : 'auto' }} />
                  </div>
                  <span className="text-xs shrink-0" style={{ fontWeight: 700, color: total >= 0 ? C.mint : C.red, ...TAB, minWidth: 88, textAlign: 'right' }}>
                    {privacy ? mask(moneySigned(total)) : moneySigned(total)}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {quarterModal && (
        <PnlDetailModal
          title="분기별 평가손익 내역"
          subtitle={`${humanPeriod(quarterModal.recordDate).label} · 원금 대비 평가손익이에요.`}
          items={quarterModalItems}
          total={quarterModalTotal}
          totalLabel="분기 합계"
          privacy={privacy}
          onClose={() => setQuarterModal(null)}
        />
      )}


      <div className="rounded-xl px-4 py-4 text-sm leading-relaxed" style={{ backgroundColor: C.cardAlt, color: C.soft }}>
        {firstH.label} 이후 {years}번의 기록 동안 순자산이{' '}
        <span style={{ whiteSpace: 'nowrap', color: C.mint, fontWeight: 600 }}>{formatM(netWorthOf(latest) - netWorthOf(firstRec))}</span> 늘었습니다.
      </div>
    </div>
  );
}

function StatCard({ label, value, sub, accent, privacy }) {
  return (
    <div className="rounded-xl p-4" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
      <div className="text-xs mb-2" style={{ color: C.muted }}>{label}</div>
      <div className="text-lg" style={{ fontWeight: 700, color: accent ? C.mint : C.white, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', ...TAB }}>
        {privacy ? mask(value) : value}
      </div>
      <div className="text-[10px] mt-1" style={{ color: C.faint, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{sub}</div>
    </div>
  );
}

          <div className="mt-4 space-y-4">

              <SettingsRow icon={<Download size={15} />} title="JSON 백업" desc="기록과 표시 설정을 하나의 파일로 저장해요." action="저장" onClick={exportJson} first />
              <SettingsRow icon={<Upload size={15} />} title="JSON 불러오기" desc="다른 기기에서 백업한 기록을 가져와요." action="불러오기" onClick={triggerImport} />
              <SettingsRow icon={<Download size={15} />} title="CSV 내보내기" desc="스프레드시트에서 기록을 살펴볼 수 있어요." action="저장" onClick={exportCsv} />
            </div>
            <div className="rounded-xl px-4 py-4 flex items-center justify-between" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
              <span className="text-sm" style={{ color: C.soft }}>기기 자동 백업</span>
              <span className="text-xs" style={{ color: autoBackupAt ? C.brand : C.faint, ...TAB }}>
                {autoBackupAt ? new Date(autoBackupAt).toLocaleString('ko-KR') : '아직 없음'}

            </div>
            <div>
              <div className="text-sm mb-1" style={{ fontWeight: 700, color: C.soft }}>토스 프록시 주소</div>
              <p className="text-xs mb-3" style={{ color: C.muted }}>
                quick tunnel은 프록시를 재시작할 때마다 주소가 바뀌어요. 주소가 바뀌면 여기서 새 주소로 바꿔주면 됩니다.
              </p>
              <div className="rounded-xl p-4" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}>
                <input
                  type="text" value={urlDraft}
                  onChange={(e) => { setUrlDraft(e.target.value); setUrlSaved(false); setUrlTest(''); }}
                  placeholder={TOSS_DEFAULT_URL}
                  className="w-full px-3 py-2.5 text-xs rounded-lg"
                  style={{ backgroundColor: C.cardAlt, border: `1px solid ${C.border}`, color: C.white }}

/* ------------------------------ combined app ----------------------------- */

export default function CombinedApp() {
  const [activeTab, setActiveTab] = useState('pnl');

  /* 테마: 저장된 값을 읽어와 C 팔레트를 갈아끼운다. applyTheme을 렌더 중에 부르므로
     아래 자식들은 모두 새 팔레트를 읽은 상태로 그려진다. */
  const [theme, setThemeState] = useState('dark');
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(THEME_KEY, false);
        const v = r ? JSON.parse(r.value) : null;
        if (v === 'light' || v === 'dark') setThemeState(v);
      } catch {}
    })();
  }, []);
  const setTheme = useCallback(async (mode) => {
    setThemeState(mode);
    try { await window.storage.set(THEME_KEY, JSON.stringify(mode), false); } catch {}
  }, []);
  applyTheme(theme);

  // 토스 프록시 주소는 두 화면(수익 탭, 자산 기록 편집)이 함께 쓰므로 최상위에서 관리한다.
  const [tossUrl, setTossUrl] = useState(TOSS_DEFAULT_URL);
  useEffect(() => { loadTossUrl().then(setTossUrl); }, []);
  const saveTossUrl = useCallback(async (next) => {
    const v = (next || '').trim() || TOSS_DEFAULT_URL;
    setTossUrl(v);
    try { await window.storage.set(TOSS_URL_KEY, JSON.stringify(v), false); } catch {}
  }, []);

  // 업비트 프록시 주소도 같은 방식으로 관리한다 (크립토 자동입력용).
  const [upbitUrl, setUpbitUrl] = useState(UPBIT_DEFAULT_URL);
  useEffect(() => { loadUpbitUrl().then(setUpbitUrl); }, []);
  const saveUpbitUrl = useCallback(async (next) => {
    const v = (next || '').trim() || UPBIT_DEFAULT_URL;
    setUpbitUrl(v);
    try { await window.storage.set(UPBIT_URL_KEY, JSON.stringify(v), false); } catch {}
  }, []);

  useEffect(() => {
    document.body.style.backgroundColor = C.bg;
  }, [theme]);

  return (
    <>
      {activeTab === 'pnl'
        ? <PnlApp tossUrl={tossUrl} theme={theme} setTheme={setTheme} />
        : <AssetApp tab={activeTab} setTab={setActiveTab} tossUrl={tossUrl} saveTossUrl={saveTossUrl} upbitUrl={upbitUrl} saveUpbitUrl={saveUpbitUrl} theme={theme} setTheme={setTheme} />}
      <BottomNav active={activeTab} setActive={setActiveTab} />
    </>
  );
}

/* ----------------------------- currency input ---------------------------- */

function CurrencyInput({ value, onChange, placeholder, style, allowNegative }) {
  const [digits, setDigits] = useState(value ? String(Math.abs(value)) : '');
  const [neg, setNeg] = useState((value || 0) < 0);

  // value가 외부(예: 토스 API 불러오기)에서 바뀌면 화면 표시도 따라가도록 동기화한다.
  // 이게 없으면 처음 마운트될 때 값으로만 고정되고, 나중에 부모가 값을 바꿔도 입력창엔 반영 안 됨.
  useEffect(() => {
    setDigits(value ? String(Math.abs(value)) : '');
    setNeg((value || 0) < 0);
  }, [value]);

  const display = digits === '' ? '' : Number(digits).toLocaleString('ko-KR');

  function handleChange(e) {
    const d = e.target.value.replace(/[^0-9]/g, '');
    setDigits(d);
    const num = d === '' ? 0 : Number(d);
    onChange(neg ? -num : num);
  }
  function selectSign(nextNeg) {
    setNeg(nextNeg);
    const num = digits === '' ? 0 : Number(digits);
    onChange(nextNeg ? -num : num);
  }

  return (
    <div className="flex items-center gap-1.5 w-full">
      {allowNegative && (
        <div className="flex rounded-lg overflow-hidden shrink-0" style={{ border: `1px solid ${C.border}` }}>
          <button
            type="button"
            onClick={() => selectSign(false)}
            className="px-2.5 py-2 text-xs"
            style={{ fontWeight: 600, backgroundColor: !neg ? C.brand : 'transparent', color: !neg ? C.brandDark : C.faint }}
          >
            이익
          </button>
          <button
            type="button"
            onClick={() => selectSign(true)}
            className="px-2.5 py-2 text-xs"
            style={{ fontWeight: 600, backgroundColor: neg ? C.red : 'transparent', color: neg ? '#2A0A0A' : C.faint }}
          >
            손실
          </button>
        </div>
      )}
      <input
        type="text"
        inputMode="numeric"
        value={display}
        onChange={handleChange}
        placeholder={placeholder}
        className="flex-1 px-3 py-2 text-sm text-right"
        style={{ boxSizing: 'border-box', minWidth: 0, ...style }}
      />
    </div>
  );
}

function RecordEditor({ editing, setEditing, onSave, onClose, tossUrl, upbitUrl }) {

  function setPrincipal(key, num) { setEditing({ ...editing, principal: { ...editing.principal, [key]: num } }); }
  function setCurrent(key, num) { setEditing({ ...editing, current: { ...editing.current, [key]: num } }); }
  function setNonInvest(key, num) { setEditing({ ...editing, nonInvest: { ...editing.nonInvest, [key]: num } }); }
  function setAnnual(key, num) { setEditing({ ...editing, annualPnl: { ...editing.annualPnl, [key]: num } }); }

  const [tossLoading, setTossLoading] = useState(false);
  const [tossError, setTossError] = useState('');

    setTossLoading(true);
    setTossError('');
    try {
      const data = await fetchTossSummary(tossUrl);
      // 원금/현재평가액을 각각 따로 setState 하면 하나가 다른 하나를 덮어써버리는

      setEditing((prev) => ({
        ...prev,

                    )}
                    {c.key === 'crypto' && upbitError && (
                      <div className="text-[11px] mb-2" style={{ color: C.red }}>{upbitError}</div>
                    )}
                    <div className="grid grid-cols-2 gap-2.5">
                      <div className="min-w-0">
                        <label className="text-[11px] mb-1 block" style={{ color: C.faint }}>원금</label>
                        <CurrencyInput
                          key={`${rk}-principal-${c.key}`}
                          value={editing.principal[c.key] || 0} onChange={(num) => setPrincipal(c.key, num)}
                          placeholder="0" style={inputStyle}
                        />
                      </div>
                      <div className="min-w-0">
                        <label className="text-[11px] mb-1 block" style={{ color: C.faint }}>현재 평가액</label>
                        <CurrencyInput
                          key={`${rk}-current-${c.key}`}
                          value={editing.current[c.key] || 0} onChange={(num) => setCurrent(c.key, num)}
                          placeholder="0" style={inputStyle}
                        />
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex items-center justify-between mt-5 pt-4" style={{ borderTop: `1px solid ${C.border}` }}>
              <span className="text-sm" style={{ color: C.soft }}>현재 평가액 합계</span>
              <span className="text-sm" style={{ fontWeight: 700, color: C.white, ...TAB }}>
                {won(invCurrentTotal)}
              </span>
            </div>
          </div>

          {/* 비투자 자산 */}
          <div>
            <div className="text-sm" style={{ fontWeight: 700 }}>
              비투자 자산 <span className="text-xs" style={{ color: C.faint, fontWeight: 400 }}>현재 금액만 기록합니다.</span>
            </div>
            <div className="space-y-3 mt-4">
              {NONINVEST_CATEGORIES.map((c) => (
                <div key={c.key}>
                  <label className="text-xs mb-1.5 block" style={{ color: C.muted }}>{c.label}</label>
                  <CurrencyInput
                    key={`${rk}-noninvest-${c.key}`}
                    value={editing.nonInvest[c.key] || 0} onChange={(num) => setNonInvest(c.key, num)}
                    placeholder="0" style={inputStyle}
                  />
                </div>
              ))}
            </div>
          </div>

          {/* 분기별 투자 손익 */}
          <div>
            <div className="text-sm" style={{ fontWeight: 700 }}>
              분기별 투자 손익 <span className="text-xs" style={{ color: C.faint, fontWeight: 400 }}>현재까지의 실현 손익을 분기마다 별도로 기록해요.</span>
            </div>
            <div className="space-y-3 mt-4">
              {BAR_PNL_CATEGORIES.map((c) => (
                <div key={c.key}>
                  <label className="text-xs mb-1.5 block" style={{ color: C.muted }}>{c.label}</label>
                  <CurrencyInput
                    key={`${rk}-annual-${c.key}`}
                    value={editing.annualPnl[c.key] || 0} onChange={(num) => setAnnual(c.key, num)}
                    placeholder="0" style={inputStyle} allowNegative
                  />
                </div>
              ))}
            </div>
            <div className="flex items-center justify-between mt-5 pt-4" style={{ borderTop: `1px solid ${C.border}` }}>
              <span className="text-sm" style={{ color: C.soft }}>분기 손익 최종 합계</span>
              <span className="text-sm" style={{ fontWeight: 700, color: annualTotal >= 0 ? C.mint : C.red, ...TAB }}>
                {moneySigned(annualTotal)}
              </span>
            </div>
          </div>

          <div>
            <label className="text-xs mb-1.5 block" style={{ color: C.muted }}>짧은 메모 (선택)</label>
            <textarea value={editing.note} onChange={(e) => setField('note', e.target.value)} rows={2}
              placeholder="예: 코인 비중 조정, 손절 반영"
              className="w-full px-3 py-2.5 text-sm resize-none" style={inputStyle} />
          </div>
        </div>

        <div className="sticky bottom-0 p-5 flex gap-3" style={{ backgroundColor: C.bgAlt, borderTop: `1px solid ${C.border}` }}>
          <button onClick={onClose} className="flex-1 py-3 rounded-xl text-sm" style={{ backgroundColor: C.cardAlt, color: C.soft, fontWeight: 600 }}>취소</button>
          <button onClick={onSave} className="flex-1 py-3 rounded-xl text-sm flex items-center justify-center gap-1.5" style={{ backgroundColor: C.brand, color: C.brandDark, fontWeight: 700 }}>
            <Check size={16} /> {editing.id ? '수정 저장' : '추가 저장'}
          </button>
        </div>
      </div>
    </div>
  );
}

window.__MOUNT_APP__();

</script>

<script>
  window.__runApp = async function () {
    if (window.__appStarted) return;
    window.__appStarted = true;
    try {
      const src = document.getElementById('app-source').textContent;
      const out = Babel.transform(src, { presets: ['react'], sourceType: 'module' }).code;
      const blob = new Blob([out], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      await import(url);
    } catch (e) {
      showBootError((e && e.stack) || String(e));
    }
  };
  // onload가 이 스크립트보다 먼저 실행됐을 수도 있으니 한 번 더 확인
  if (window.__babelReady || window.Babel) window.__runApp();
  // 혹시 몰라 3초 후에도 아무 반응 없으면(둘 다 못 걸렸으면) 원인 안내
  setTimeout(() => {
    if (!window.__appStarted) {
      showBootError('Babel 로딩이 너무 오래 걸리고 있어요. 네트워크가 이 화면에서 막혀있을 수 있어요 — 실제 배포 주소(pages.dev)에서 열어보세요.');
    }
  }, 8000);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
